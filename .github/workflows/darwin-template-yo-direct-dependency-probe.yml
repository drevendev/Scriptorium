name: Darwin/Rachinsky template yo direct-dependency probe

on:
  pull_request:
    paths:
      - ".github/workflows/darwin-template-yo-direct-dependency-probe.yml"
      - "scriptorium/darwin_template_dependency_scan.py"
      - "scriptorium/darwin_template_yo_replay_contract_v4.py"
      - "tests/test_darwin_template_dependency_scan.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe exact-root transclusion dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run direct-dependency regressions
        run: python -m unittest tests.test_darwin_template_dependency_scan tests.test_darwin_template_yo_replay_contract_v3 -v

      - name: Build source-free v4 contract for bootstrap verification
        run: |
          set -euo pipefail
          mkdir -p build/repro
          python -m scriptorium.darwin_template_yo_replay_contract_v4 \
            --evidence corpus/candidates/source-edition-traces/darwin-origin-species-rachinsky-1864-ru.template-yo-evidence.json \
            --v2-predecessor-contract corpus/candidates/source-edition-traces/darwin-origin-species-rachinsky-1864-ru.template-yo-replay-contract.json \
            --predecessor-contract corpus/candidates/source-edition-traces/darwin-origin-species-rachinsky-1864-ru.template-yo-replay-contract-v3.json \
            --output build/repro/darwin-origin-species-rachinsky-1864-ru.template-yo-replay-contract-v4.json
          echo SCRIPTORIUM_V4_CONTRACT_BEGIN
          cat build/repro/darwin-origin-species-rachinsky-1864-ru.template-yo-replay-contract-v4.json
          echo SCRIPTORIUM_V4_CONTRACT_END

      - name: Query exact historical source and emit source-free dependency evidence
        run: |
          set -euo pipefail
          for oldid in 5687302 3684646; do
            curl --fail --silent --show-error --location --get \
              --retry 4 --retry-all-errors --retry-delay 4 \
              --max-time 30 \
              --user-agent 'Scriptorium/0.1 (https://github.com/drevendev/Scriptorium; source-provenance verification)' \
              'https://ru.wikisource.org/w/api.php' \
              --data-urlencode 'action=query' \
              --data-urlencode 'format=json' \
              --data-urlencode 'formatversion=2' \
              --data-urlencode 'prop=revisions' \
              --data-urlencode "revids=${oldid}" \
              --data-urlencode 'rvprop=ids|timestamp|sha1|content' \
              --data-urlencode 'rvslots=main' \
              --output "revision-${oldid}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from scriptorium.darwin_template_dependency_scan import source_free_scan_observation

          expected = {
              5687302: ("Шаблон:Ё", "963c1796d693d5451cf0c0897c35bd7e5b327ae1"),
              3684646: ("Шаблон:ЕЁ", "435bb2a412d8fb5962ccd5adc0ac2e03412fe109"),
          }
          for oldid, (expected_title, expected_sha1) in expected.items():
              payload = json.loads(Path(f"revision-{oldid}.json").read_text(encoding="utf-8"))
              pages = payload["query"]["pages"]
              assert len(pages) == 1, pages
              page = pages[0]
              revision = page["revisions"][0]
              assert page["title"] == expected_title, page["title"]
              assert revision["revid"] == oldid, revision
              assert revision["sha1"] == expected_sha1, revision["sha1"]
              observation = source_free_scan_observation(revision["slots"]["main"]["content"])
              assert observation["source_sha1"] == expected_sha1, observation
              print(f"SCRIPTORIUM_ROOT={expected_title}@{oldid}")
              print("SCRIPTORIUM_SOURCE_FREE_OBSERVATION=" + json.dumps(observation, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY
