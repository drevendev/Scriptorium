name: Humiliated and Insulted source-free diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/humiliated-measured.yml"
      - "scriptorium/humiliated_diagnostic.py"
      - "scriptorium/single_page_body.py"
      - "scriptorium/metrics.py"
      - "scriptorium/text.py"
      - "scriptorium/dialogue.py"
      - "scriptorium/vocabulary.py"
      - "tests/test_humiliated_diagnostic.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Replay pinned four-part novel and produce source-free JSON
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Positive, negative and privacy regression tests
        run: python -m unittest discover -s tests -p test_humiliated_diagnostic.py -v
      - name: Analyze transient pinned Wikisource text
        run: |
          python -m scriptorium.humiliated_diagnostic \
            --output "$RUNNER_TEMP/humiliated-measured.json"
      - name: Validate derived artifact and scientific boundaries
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "humiliated-measured.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          rows = data["metric_rows"]
          assert len(rows) == 29 and len({r["metric_id"] for r in rows}) == 29
          assert data["source"]["revision_id"] == 5611473
          assert data["body"]["characters_including_spaces"] >= 300000
          assert data["body"]["normalized_characters_including_spaces"] >= 300000
          assert data["gates"]["complete_chapter_inventory"] is True
          assert data["gates"]["source_text_committed"] is False
          assert data["gates"]["fantlab_input_identity"] == "UNKNOWN"
          assert data["gates"]["m2_weight"] == 0
          assert data["gates"]["m2_parity_admissible"] is False
          assert all(r["fantlab_display"] is None for r in rows)
          assert sum(r["actual"] is not None for r in rows) >= 20
          assert sum(r["result"] == "NOT_RUN_DICTIONARY_UNBOUND" for r in rows) == 5
          assert all(r["actual"] is None for r in rows if r["result"] == "NOT_RUN_DICTIONARY_UNBOUND")
          for digest in (data["source"]["wikitext_sha256"],
                         data["body"]["raw_sha256"], data["body"]["normalized_sha256"]):
              assert re.fullmatch(r"[0-9a-f]{64}", digest)
          assert path.stat().st_size < 50000, "possible source-text leakage"
          assert not any(key in data for key in ("wikitext", "full_text", "literary_prose"))
          print("HUMILIATED_DERIVED_ARTIFACT=PASS; M2=0/5; corpus_count_unchanged=true")
          PY
      - name: Upload only derived measurements, never prose
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: humiliated-source-free-measured-fields
          path: ${{ runner.temp }}/humiliated-measured.json
          if-no-files-found: error
          retention-days: 7
