name: Hyperboloid measured field diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/hyperboloid-diagnostic.yml"
      - "scriptorium/hyperboloid_diagnostic.py"
      - "scriptorium/hyperboloid_freeze.py"
      - "scriptorium/metrics.py"
      - "scriptorium/text.py"
      - "scriptorium/dialogue.py"
      - "scriptorium/vocabulary.py"
      - "tests/test_hyperboloid_diagnostic.py"
      - "tests/test_hyperboloid_freeze.py"
      - "corpus/candidates/source-edition-traces/tolstoy-hyperboloid-garin-wikisource-ru.revision.json"
      - "corpus/candidates/source-edition-traces/tolstoy-hyperboloid-garin-wikisource-ru.body.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Replay pinned 499066-character literary body transiently
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test pinned fields and fail-closed provenance
        run: python -m unittest discover -s tests -p test_hyperboloid_diagnostic.py -v
      - name: Measure frozen literary body without saving prose
        run: |
          python -m scriptorium.hyperboloid_diagnostic \
            --revision-manifest corpus/candidates/source-edition-traces/tolstoy-hyperboloid-garin-wikisource-ru.revision.json \
            --body-manifest corpus/candidates/source-edition-traces/tolstoy-hyperboloid-garin-wikisource-ru.body.json \
            --output /tmp/hyperboloid-derived-fields.json
      - name: Check counts, retained references and source safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/hyperboloid-derived-fields.json").read_text(encoding="utf-8"))
          rows = {r["metric_id"]: r for r in data["metric_rows"]}
          assert len(rows) == len(data["metric_rows"]) == 29
          assert 21 <= sum(r["actual"] is not None for r in rows.values()) <= 24
          assert rows["fantlab.general.characters"]["actual"] == 499066
          assert rows["fantlab.general.characters"]["fantlab_display"] == "495539"
          assert rows["fantlab.general.characters"]["actual_minus_fantlab_display"] == 3527
          assert rows["fantlab.general.words"]["fantlab_display"] == "69126"
          assert data["body_identity"]["revision_id"] == 5014458
          assert data["body_identity"]["raw_sha256"] == "a01c5eadef53b2437eff3abe6052bb7f7bf6f95737641558343363628da7f513"
          assert data["source_text_committed"] is False
          assert data["gates"] == {
              "calibration_size_met": True,
              "fantlab_source_edition_match": "unknown",
              "m2_parity_admissible": False, "m2_weight": 0,
          }
          assert all(r["fantlab_display"] is None for key,r in rows.items()
                     if key not in ("fantlab.general.characters", "fantlab.general.words"))
          assert all(rows[key]["actual"] is None for key in (
              "fantlab.vocabulary.active_dictionary", "fantlab.vocabulary.active_nondictionary",
              "fantlab.vocabulary.uasz_3000", "fantlab.vocabulary.uasz_10000",
              "fantlab.vocabulary.uasz_100000"))
          print("HYPERBOLOID_SOURCE_FREE_PASS=29, two retained references, no parity")
          PY
      - name: Upload derived JSON only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hyperboloid-derived-fields
          path: /tmp/hyperboloid-derived-fields.json
          if-no-files-found: error
          retention-days: 7
