name: Brothers Karamazov source freeze

on:
  pull_request:
    paths:
      - ".github/workflows/karamazov-freeze.yml"
      - "scriptorium/karamazov_freeze.py"
      - "tests/test_karamazov_freeze.py"
      - "corpus/candidates/source-edition-traces/dostoevsky-brothers-karamazov-ru.revisions.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture Brothers Karamazov source identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v

      - name: Probe unsupported template names on the current failing leaf
        run: |
          python - <<'PY'
          import collections
          import html
          import json
          import re
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from scriptorium.karamazov_freeze import (
              _BODY_DIV_RE,
              _NOINCLUDE_RE,
              _ONLYINCLUDE_RE,
              _find_balanced_template_end,
              _split_template_parts,
              _strip_wikisource_editor_notes,
              _unwrap_literary_headings,
              _unwrap_poem1_templates,
              _unwrap_typo_templates,
              expected_segments,
              fetch_current_segment_revisions,
          )

          target = next(
              row for row in expected_segments()
              if str(row["title"]).endswith("/Книга двенадцатая/III")
          )
          source = str(fetch_current_segment_revisions((target,))[str(target["title"])]["wikitext"])
          source = _strip_wikisource_editor_notes(_NOINCLUDE_RE.sub("", source))
          source = _unwrap_typo_templates(source)
          source = _unwrap_poem1_templates(source)
          onlyinclude = _ONLYINCLUDE_RE.findall(source)
          if onlyinclude:
              fragments = [_unwrap_literary_headings(onlyinclude[0])]
          else:
              fragments = [_unwrap_literary_headings(value) for value in _BODY_DIV_RE.findall(source)]

          shapes = collections.Counter()
          for fragment in fragments:
              cursor = 0
              start_re = re.compile(r"\{\{\s*([^|{}\n]+)")
              while True:
                  match = start_re.search(fragment, cursor)
                  if match is None:
                      break
                  end = _find_balanced_template_end(fragment, match.start())
                  raw = fragment[match.start():end]
                  parts = _split_template_parts(raw[2:-2])
                  name = re.sub(r"\s+", " ", parts[0].strip()).casefold()
                  args = parts[1:]
                  shape = (
                      name,
                      len(args),
                      tuple(not arg.strip() for arg in args),
                      tuple(bool(re.fullmatch(r"\s*\d+(?:[.,]\d+)?\s*", arg)) for arg in args),
                      tuple(len(re.findall(r"\{\{", arg)) for arg in args),
                      tuple("[[" in arg or "]]" in arg for arg in args),
                  )
                  shapes[shape] += 1
                  cursor = end

          payload = [
              {
                  "name": shape[0],
                  "arg_count": shape[1],
                  "blank_flags": shape[2],
                  "numeric_flags": shape[3],
                  "nested_template_counts": shape[4],
                  "contains_links_flags": shape[5],
                  "count": count,
              }
              for shape, count in sorted(shapes.items())
          ]
          print("SCRIPTORIUM_KARAMAZOV_TEMPLATE_SHAPES=" + json.dumps(
              payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ))

          query = urlencode({
              "action": "expandtemplates",
              "text": "{{NB}}",
              "prop": "wikitext",
              "format": "json",
              "formatversion": "2",
          })
          request = Request(
              "https://ru.wikisource.org/w/api.php?" + query,
              headers={"User-Agent": "Scriptorium/0.1 source-free provenance probe"},
          )
          with urlopen(request, timeout=20) as response:
              expanded = json.load(response)["expandtemplates"]["wikitext"]
          decoded = html.unescape(expanded)
          print("SCRIPTORIUM_WIKISOURCE_NB_RENDER=" + json.dumps({
              "expanded_length": len(expanded),
              "decoded_length": len(decoded),
              "decoded_codepoints": [f"U+{ord(char):04X}" for char in decoded],
          }, sort_keys=True, separators=(",", ":")))
          PY

      - name: Capture exact source revisions and composite hashes
        run: |
          set -euo pipefail
          mkdir -p build/repro
          python -m scriptorium.karamazov_freeze capture \
            --output build/repro/dostoevsky-brothers-karamazov-ru.revisions.json

      - name: Emit source-free capture summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("build/repro/dostoevsky-brothers-karamazov-ru.revisions.json").read_text(
                  encoding="utf-8"
              )
          )
          encoding = manifest["source_identity_encoding"]
          summary = {
              "candidate_id": manifest["candidate_id"],
              "source_segment_count": encoding["source_segment_count"],
              "first_revision_id": encoding["revision_ids"][0],
              "last_revision_id": encoding["revision_ids"][-1],
              "composite_identity": manifest["composite_identity"],
              "extraction_profile": manifest["composition"]["extraction_profile"],
              "source_text_committed": manifest["composition"]["source_text_committed"],
          }
          print("SCRIPTORIUM_KARAMAZOV_CAPTURE=" + json.dumps(
              summary, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ))
          PY

      - name: Upload source-free revision manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: karamazov-source-revision-manifest
          path: build/repro/dostoevsky-brothers-karamazov-ru.revisions.json
          if-no-files-found: error
          retention-days: 7
