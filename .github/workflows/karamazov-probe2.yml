name: Karamazov Poem1 shape probe

on:
  pull_request:
    paths:
      - ".github/workflows/karamazov-probe2.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Emit source-free Poem1 signatures
        run: |
          python - <<'PY'
          import re
          from scriptorium.karamazov_freeze import _POEM1_RE, expected_segments, fetch_current_segment_revisions

          target = next(row for row in expected_segments() if str(row["title"]).endswith("/Книга третья/III"))
          source = str(fetch_current_segment_revisions((target,))[str(target["title"])]["wikitext"])
          onlyinclude = re.findall(r"<onlyinclude>(.*?)</onlyinclude>", source, re.I | re.S)
          probe = onlyinclude[0] if len(onlyinclude) == 1 else source

          def split_args(inner):
              parts=[]; buf=[]; tdepth=0; ldepth=0; i=0
              while i < len(inner):
                  pair=inner[i:i+2]
                  if pair == "{{": tdepth += 1; buf.append(pair); i += 2; continue
                  if pair == "}}": tdepth -= 1; buf.append(pair); i += 2; continue
                  if pair == "[[": ldepth += 1; buf.append(pair); i += 2; continue
                  if pair == "]]": ldepth -= 1; buf.append(pair); i += 2; continue
                  if inner[i] == "|" and tdepth == 0 and ldepth == 0:
                      parts.append("".join(buf)); buf=[]; i += 1; continue
                  buf.append(inner[i]); i += 1
              parts.append("".join(buf))
              return parts

          sigs=[]; pos=0
          while True:
              start=re.search(r"\{\{\s*poem1\b", probe[pos:], re.I)
              if start is None: break
              s=pos+start.start(); depth=0; i=s; end=None
              while i < len(probe)-1:
                  pair=probe[i:i+2]
                  if pair == "{{": depth += 1; i += 2; continue
                  if pair == "}}":
                      depth -= 1; i += 2
                      if depth == 0: end=i; break
                      continue
                  i += 1
              if end is None: raise SystemExit("unbalanced Poem1")
              raw=probe[s:end]
              parts=split_args(raw[2:-2]); args=parts[1:]
              meta=[]
              for arg in args:
                  meta.append({
                      "length": len(arg),
                      "lines": arg.count("\n")+1,
                      "blank": not bool(arg.strip()),
                      "starts_poem": bool(re.match(r"\s*<poem\b", arg, re.I)),
                      "ends_poem": bool(re.search(r"</poem>\s*$", arg, re.I)),
                      "nested_names": sorted(set(m.group(1).strip().casefold() for m in re.finditer(r"\{\{\s*([^|{}\n]+)", arg))),
                  })
              sigs.append({"args":meta,"regex_fullmatch":bool(_POEM1_RE.fullmatch(raw))})
              pos=end
          print("SCRIPTORIUM_POEM1_INVOCATIONS=" + str(len(sigs)))
          for idx,sig in enumerate(sigs,1): print(f"SCRIPTORIUM_POEM1_SIG_{idx}={sig!r}")
          PY
