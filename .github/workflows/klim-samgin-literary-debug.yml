name: Klim Samgin literary-body repair

on:
  pull_request:
    paths:
      - ".github/workflows/klim-samgin-literary-debug.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Apply bounded encoded-angle repair
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path('scriptorium/klim_samgin_literary_body.py')
          source = module.read_text(encoding='utf-8')
          replacements = [
              (
                  'import argparse\nfrom hashlib import sha256',
                  'import argparse\nimport html\nfrom hashlib import sha256',
              ),
              (
                  '_ANGLE_SPAN_RE = re.compile(r"<(?P<inner>[^<>\\r\\n]*)>")\n_TAGLIKE_INNER_RE',
                  '_ANGLE_SPAN_RE = re.compile(r"<(?P<inner>[^<>\\r\\n]*)>")\n_ENCODED_ANGLE_SPAN_RE = re.compile(r"&lt;(?P<inner>[^\\r\\n]*?)&gt;", re.IGNORECASE)\n_TAGLIKE_INNER_RE',
              ),
              (
                  'def _protect_literal_angle_spans(source: str) -> tuple[str, list[tuple[str, str]]]:\n',
                  '''def _protect_encoded_angle_spans(source: str) -> tuple[str, list[tuple[str, str]]]:\n    """Protect bounded entity-encoded angle prose before shared HTML unescaping."""\n    protected: list[tuple[str, str]] = []\n    prefix = "SCRIPTORIUMKLIMENCODEDANGLETOKEN"\n    if prefix in source:\n        raise ValueError("encoded-angle placeholder prefix collides with source")\n\n    def replace(match: re.Match[str]) -> str:\n        decoded = html.unescape(match.group(0))\n        parsed = _ANGLE_SPAN_RE.fullmatch(decoded)\n        if parsed is None:\n            return match.group(0)\n        inner = parsed.group("inner")\n        stripped = inner.lstrip()\n        if not stripped or stripped.startswith(("!--", "!DOCTYPE", "?")) or _TAGLIKE_INNER_RE.match(inner):\n            return match.group(0)\n        token = f"{prefix}{len(protected):04d}END"\n        protected.append((token, decoded))\n        return token\n\n    return _ENCODED_ANGLE_SPAN_RE.sub(replace, source), protected\n\n\ndef _protect_literal_angle_spans(source: str) -> tuple[str, list[tuple[str, str]]]:\n''',
              ),
              (
                  '    source, protected_nowiki = _protect_nowiki(source, expected_tag_count=int(tags.get("nowiki", 0)))\n    source, protected_lines = _protect_literal_line_openers(source)\n',
                  '    source, protected_nowiki = _protect_nowiki(source, expected_tag_count=int(tags.get("nowiki", 0)))\n    source, protected_encoded_angles = _protect_encoded_angle_spans(source)\n    source, protected_lines = _protect_literal_line_openers(source)\n',
              ),
              (
                  '    rendered = _restore_tokens(rendered, protected_angles, label="angle")\n    rendered = _restore_tokens(rendered, protected_lines, label="line-opener")\n',
                  '    rendered = _restore_tokens(rendered, protected_angles, label="angle")\n    rendered = _restore_tokens(rendered, protected_encoded_angles, label="encoded-angle")\n    rendered = _restore_tokens(rendered, protected_lines, label="line-opener")\n',
              ),
              (
                  '        "literal_line_opener_preservation_count": len(protected_lines),\n        "literal_angle_span_preservation_count": len(protected_angles),\n',
                  '        "literal_line_opener_preservation_count": len(protected_lines),\n        "entity_encoded_angle_span_preservation_count": len(protected_encoded_angles),\n        "literal_angle_span_preservation_count": len(protected_angles),\n',
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one repair marker, got {source.count(old)}')
              source = source.replace(old, new, 1)
          module.write_text(source, encoding='utf-8')

          tests = Path('tests/test_klim_samgin_literary_body.py')
          value = tests.read_text(encoding='utf-8')
          old = '    _identity,\n    _protect_literal_line_openers,\n'
          new = '    _identity,\n    _protect_encoded_angle_spans,\n    _protect_literal_line_openers,\n'
          if value.count(old) != 1:
              raise SystemExit('encoded-angle test import marker drift')
          value = value.replace(old, new, 1)
          marker = '    def test_literal_line_openers_are_protected_but_table_delimiters_fail(self) -> None:\n'
          test = '''    def test_entity_encoded_angle_literal_is_protected_as_visible_text(self) -> None:\n        source, protected = _protect_encoded_angle_spans("before &lt;слово&gt; after")\n        self.assertNotIn("&lt;", source)\n        self.assertEqual(len(protected), 1)\n        self.assertEqual(_restore_tokens(source, protected, label="encoded-angle"), "before <слово> after")\n        untouched, protected_tag = _protect_encoded_angle_spans("&lt;ref&gt;")\n        self.assertEqual(untouched, "&lt;ref&gt;")\n        self.assertEqual(protected_tag, [])\n\n'''
          if value.count(marker) != 1:
              raise SystemExit('encoded-angle test insertion marker drift')
          value = value.replace(marker, test + marker, 1)
          tests.write_text(value, encoding='utf-8')
          PY
      - name: Verify repair
        run: python -m unittest discover -s tests -v
      - name: Commit repaired extractor
        run: |
          set -euo pipefail
          git config user.name "andy-zen-dev"
          git config user.email "andyzendev@gmail.com"
          git add scriptorium/klim_samgin_literary_body.py tests/test_klim_samgin_literary_body.py
          git diff --cached --check
          git commit -m "Preserve encoded angle prose in Klim extraction"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}