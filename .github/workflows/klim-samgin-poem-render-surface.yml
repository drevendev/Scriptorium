name: Klim Samgin bounded Poem render surface

on:
  pull_request:
    paths:
      - ".github/workflows/klim-samgin-poem-render-surface.yml"
      - "scriptorium/mediawiki_poem_render_surface.py"
      - "tests/test_mediawiki_poem_render_surface.py"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.part2-part2.revision.json"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poemx1-template.bindings.json"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poemx1-content.json"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poem-tag-surface.json"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poem-extension-anchor.json"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poem-render-surface.json"
      - "corpus/candidates/gorky-klim-samgin-ru.md"
      - "project/STATE_AND_QUEUE.md"
      - "project/CHANGELOG.d/SCRIP-CORPUS-020-poem-render-surface.md"
      - "project/run-receipts/SCRIP-CORPUS-020-poem-render-surface.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Reproduce reached plain-value recursive parse and Poem branches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v

      - name: Re-fetch dependency and reconstruct bounded render surface
        run: |
          set -euo pipefail
          mkdir -p build/repro
          python - <<'PY'
          import json
          from pathlib import Path

          from scriptorium.mediawiki_poem_render_surface import (
              build_poem_render_surface_manifest,
          )
          from scriptorium.single_page_body import fetch_pinned_wikitext
          from scriptorium.single_page_revision import (
              validate_manifest as validate_revision_manifest,
          )

          root = Path('corpus/candidates/source-edition-traces')
          revision_manifest = json.loads(
              (root / 'gorky-klim-samgin-ru.part2-part2.revision.json').read_text(
                  encoding='utf-8'
              )
          )
          validate_revision_manifest(revision_manifest)
          identity = revision_manifest['source_identity']
          fetched = fetch_pinned_wikitext(
              title=identity['title'], revision_id=identity['revision_id']
          )
          dependency_wikitext = fetched.pop('wikitext')
          assert fetched == identity

          def load(name: str):
              return json.loads((root / name).read_text(encoding='utf-8'))

          manifest = build_poem_render_surface_manifest(
              dependency_wikitext=dependency_wikitext,
              binding_manifest=load(
                  'gorky-klim-samgin-ru.poemx1-template.bindings.json'
              ),
              content_manifest=load('gorky-klim-samgin-ru.poemx1-content.json'),
              tag_manifest=load('gorky-klim-samgin-ru.poem-tag-surface.json'),
              poem_anchor_manifest=load(
                  'gorky-klim-samgin-ru.poem-extension-anchor.json'
              ),
              research_date='2026-09-18',
          )
          observed = Path(
              'build/repro/gorky-klim-samgin-ru.poem-render-surface.json'
          )
          observed.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('SCRIPTORIUM_POEM_RENDER_SURFACE=' + json.dumps(
              {
                  'aggregate': manifest['aggregate'],
                  'invocations': [
                      {
                          'invocation_index': row['invocation_index'],
                          'core_sensitive_surface': row['core_sensitive_surface'],
                          'poem_branch_surface': row['poem_branch_surface'],
                          'reconstruction': row['reconstruction'],
                      }
                      for row in manifest['invocations']
                  ],
              },
              ensure_ascii=False,
              sort_keys=True,
              separators=(',', ':'),
          ))
          PY

      - name: Upload generated source-free render evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: klim-samgin-poem-render-surface
          path: build/repro/gorky-klim-samgin-ru.poem-render-surface.json
          if-no-files-found: error
          retention-days: 1

      - name: Compare committed source-free render evidence when present
        run: |
          set -euo pipefail
          expected=corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poem-render-surface.json
          observed=build/repro/gorky-klim-samgin-ru.poem-render-surface.json
          if test -f "$expected"; then
            cmp "$expected" "$observed"
          else
            echo "Initial authoring pass: generated evidence will be committed before final verification."
          fi
