name: Klim Samgin poemx1 invocation bindings

on:
  pull_request:
    paths:
      - ".github/workflows/klim-samgin-template-bindings.yml"
      - "scriptorium/mediawiki_template_invocation.py"
      - "tests/test_mediawiki_template_invocation.py"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.part2-part2.revision.json"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poemx1-template.parameters.json"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poemx1-template.bindings.json"
      - "corpus/candidates/gorky-klim-samgin-ru.md"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.json"
      - "project/STATE_AND_QUEUE.md"
      - "project/CHANGELOG.d/SCRIP-CORPUS-020.md"
      - "project/run-receipts/SCRIP-CORPUS-020-poemx1-bindings.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Freeze concrete poemx1 invocation bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v

      - name: Re-fetch pinned dependency and generate source-free invocation bindings
        run: |
          set -euo pipefail
          mkdir -p build/repro
          python - <<'PY'
          import json
          from pathlib import Path

          from scriptorium.mediawiki_template_invocation import build_invocation_binding_manifest
          from scriptorium.single_page_body import fetch_pinned_wikitext
          from scriptorium.single_page_revision import validate_manifest as validate_revision_manifest

          revision_path = Path(
              'corpus/candidates/source-edition-traces/'
              'gorky-klim-samgin-ru.part2-part2.revision.json'
          )
          parameter_path = Path(
              'corpus/candidates/source-edition-traces/'
              'gorky-klim-samgin-ru.poemx1-template.parameters.json'
          )
          revision_manifest = json.loads(revision_path.read_text(encoding='utf-8'))
          validate_revision_manifest(revision_manifest)
          identity = revision_manifest['source_identity']
          fetched = fetch_pinned_wikitext(
              title=identity['title'], revision_id=identity['revision_id']
          )
          text = fetched.pop('wikitext')
          assert fetched == identity

          parameter_manifest = json.loads(parameter_path.read_text(encoding='utf-8'))
          names = sorted(parameter_manifest['parameter_surface']['parameter_reference_counts'])
          manifest = build_invocation_binding_manifest(
              candidate_id='gorky-klim-samgin-ru-poemx1-invocations',
              dependency_revision_identity=identity,
              dependency_wikitext=text,
              parameter_surface_names=names,
              research_date='2026-09-17',
          )
          observed = Path(
              'build/repro/gorky-klim-samgin-ru.poemx1-template.bindings.json'
          )
          observed.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('SCRIPTORIUM_POEMX1_BINDINGS=' + json.dumps(
              manifest, ensure_ascii=False, sort_keys=True, separators=(',', ':')
          ))
          PY

      - name: Compare committed source-free invocation-binding evidence
        run: |
          set -euo pipefail
          expected=corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poemx1-template.bindings.json
          observed=build/repro/gorky-klim-samgin-ru.poemx1-template.bindings.json
          test -f "$expected"
          cmp "$expected" "$observed"
