name: Klim Samgin historical template dependency

on:
  pull_request:
    paths:
      - ".github/workflows/klim-samgin-template-history.yml"
      - "scriptorium/template_history.py"
      - "scriptorium/mediawiki_transclusion.py"
      - "tests/test_template_history.py"
      - "tests/test_mediawiki_transclusion.py"
      - "corpus/candidates/gorky-klim-samgin-ru.md"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poemx1-template.revision.json"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poemx1-template.shape.json"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poemx1-template.transclusion.json"
      - "corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.part2-lst.json"
      - "project/STATE_AND_QUEUE.md"
      - "project/CHANGELOG.d/SCRIP-CORPUS-020.md"
      - "project/run-receipts/SCRIP-CORPUS-020.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: Freeze historical poemx1 revision and inclusion semantics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v

      - name: Require the pinned Part 2 dependency shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path(
              'corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.part2-lst.json'
          ).read_text(encoding='utf-8'))
          shape = contract['dependency_shape']
          assert shape['template_name_counts'] == {'poemx1': 6}
          assert shape['section_tag_count'] == 0
          assert shape['lst_invocation_count'] == 0
          assert contract['parent_revision']['revision_id'] == 5198033
          assert contract['parent_revision']['revision_timestamp'] == '2024-11-26T11:16:35Z'
          assert contract['capture_scope']['mediawiki_template_dom_expansion_reproduced'] is False
          PY

      - name: Capture historical poemx1 revision identity at the parent-save anchor
        run: |
          set -euo pipefail
          mkdir -p build/repro
          python -m scriptorium.template_history capture \
            --candidate-id gorky-klim-samgin-ru-poemx1-template \
            --title 'Шаблон:Poemx1' \
            --anchor-timestamp '2024-11-26T11:16:35Z' \
            --anchor-revision-id 5198033 \
            --output build/repro/gorky-klim-samgin-ru.poemx1-template.revision.observed.json
          cat build/repro/gorky-klim-samgin-ru.poemx1-template.revision.observed.json

      - name: Probe selected template source shape without prose
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path
          import re
          from scriptorium.single_page_body import fetch_pinned_wikitext

          observed = json.loads(Path(
              'build/repro/gorky-klim-samgin-ru.poemx1-template.revision.observed.json'
          ).read_text(encoding='utf-8'))
          identity = observed['source_identity']
          fetched = fetch_pinned_wikitext(
              title=identity['title'], revision_id=identity['revision_id']
          )
          text = fetched.pop('wikitext')
          assert fetched == identity

          opening_re = re.compile(r'(?<!\{)\{\{(?!\{)\s*([^|{}\n]+)')
          html_re = re.compile(r'</?\s*([A-Za-z][A-Za-z0-9]*)\b')
          templates = Counter()
          parser_functions = Counter()
          magic_words = Counter()
          for match in opening_re.finditer(text):
              raw = match.group(1).strip()
              if not raw:
                  continue
              if raw.startswith('#'):
                  parser_functions[raw.split(':', 1)[0]] += 1
              elif raw.upper() in {'PAGENAME'}:
                  magic_words[raw.upper()] += 1
              else:
                  templates[raw] += 1

          diagnostic = {
              'probe_version': 'scriptorium-historical-template-shape-v2',
              'candidate_id': observed['candidate_id'],
              'revision_id': identity['revision_id'],
              'raw_template_name_counts': dict(sorted(templates.items())),
              'parser_function_counts': dict(sorted(parser_functions.items())),
              'magic_word_counts': dict(sorted(magic_words.items())),
              'html_tag_name_counts': dict(sorted(Counter(
                  match.group(1).lower() for match in html_re.finditer(text)
              ).items())),
              'classification_boundary': (
                  'Raw source-shape inventory only. It excludes triple-brace parameters and separates '
                  'parser functions/magic words, but does not yet apply noinclude/includeonly/onlyinclude '
                  'transclusion semantics or prove an effective dependency graph.'
              ),
              'source_text_included': False,
          }
          Path('build/repro/gorky-klim-samgin-ru.poemx1-template.shape.json').write_text(
              json.dumps(diagnostic, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('SCRIPTORIUM_POEMX1_SHAPE=' + json.dumps(
              diagnostic, ensure_ascii=False, sort_keys=True, separators=(',', ':')
          ))
          PY

      - name: Apply and freeze MediaWiki partial-transclusion control semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scriptorium.mediawiki_transclusion import build_transclusion_shape_manifest
          from scriptorium.single_page_body import fetch_pinned_wikitext

          observed = json.loads(Path(
              'build/repro/gorky-klim-samgin-ru.poemx1-template.revision.observed.json'
          ).read_text(encoding='utf-8'))
          identity = observed['source_identity']
          fetched = fetch_pinned_wikitext(
              title=identity['title'], revision_id=identity['revision_id']
          )
          text = fetched.pop('wikitext')
          assert fetched == identity
          manifest = build_transclusion_shape_manifest(
              candidate_id=observed['candidate_id'],
              revision_identity=identity,
              wikitext=text,
              research_date='2026-09-17',
          )
          path = Path('build/repro/gorky-klim-samgin-ru.poemx1-template.transclusion.json')
          path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('SCRIPTORIUM_POEMX1_TRANSCLUSION=' + json.dumps(
              manifest, ensure_ascii=False, sort_keys=True, separators=(',', ':')
          ))
          PY

      - name: Compare and replay committed historical template evidence
        run: |
          set -euo pipefail
          expected=corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poemx1-template.revision.json
          observed=build/repro/gorky-klim-samgin-ru.poemx1-template.revision.observed.json
          expected_shape=corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poemx1-template.shape.json
          observed_shape=build/repro/gorky-klim-samgin-ru.poemx1-template.shape.json
          expected_transclusion=corpus/candidates/source-edition-traces/gorky-klim-samgin-ru.poemx1-template.transclusion.json
          observed_transclusion=build/repro/gorky-klim-samgin-ru.poemx1-template.transclusion.json
          test -f "$expected"
          test -f "$expected_shape"
          test -f "$expected_transclusion"
          cmp "$expected" "$observed"
          cmp "$expected_shape" "$observed_shape"
          cmp "$expected_transclusion" "$observed_transclusion"
          python -m scriptorium.template_history replay \
            --manifest "$expected" \
            --receipt build/repro/gorky-klim-samgin-ru.poemx1-template.revision.replay.json
