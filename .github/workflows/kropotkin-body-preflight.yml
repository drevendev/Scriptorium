name: Kropotkin pinned body preflight

on:
  pull_request:
    paths:
      - ".github/workflows/kropotkin-body-preflight.yml"
      - "scriptorium/kropotkin_body_preflight.py"
      - "scriptorium/kropotkin_revisions.py"
      - "scriptorium/wikisource_freeze.py"
      - "scriptorium/mediawiki_api.py"
      - "tests/test_kropotkin_body_preflight.py"
      - "scriptorium/kropotkin_page_witnesses.py"
      - "tests/test_kropotkin_page_witnesses.py"
      - "scriptorium/kropotkin_rendered.py"
      - "tests/test_kropotkin_rendered.py"
      - "scriptorium/kropotkin_appendix_gap.py"
      - "tests/test_kropotkin_appendix_gap.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -p test_kropotkin_body_preflight.py -v
      - name: Inspect pinned route sources without retaining prose
        run: |
          mkdir -p build/repro
          python -m scriptorium.kropotkin_body_preflight --output build/repro/kropotkin-body-preflight.json
      - name: Verify all pinned literal routes and front-matter scan candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/repro/kropotkin-body-preflight.json").read_text())
          assert report["schema"] == "scriptorium-kropotkin-body-preflight-v3"
          assert report["route_count"] == report["literal_selector_route_count"] == 29
          assert report["routes"][0]["revision_id"] == 5712799
          assert report["routes"][1]["revision_id"] == 3485537
          assert report["routes"][0]["literal_page_selectors"][0]["candidate_scan_pages"] == [5]
          assert report["routes"][1]["literal_page_selectors"][0]["candidate_scan_pages"] == list(range(11, 23))
          assert report["candidate_scan_page_union"] == [5, *range(11, 348)]
          assert not report["effective_page_graph_verified"]
          assert not report["body_frozen"]
          assert not report["notes_boundary_verified"]
          assert report["body_characters"] is None
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kropotkin-body-preflight
          path: build/repro/kropotkin-body-preflight.json
          if-no-files-found: error
          retention-days: 7
      - run: python -m unittest discover -s tests -p test_kropotkin_page_witnesses.py -v
      - name: Replay accepted partial Page witnesses without retaining prose
        run: python -m scriptorium.kropotkin_page_witnesses --replay --output build/repro/kropotkin-page-witnesses.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kropotkin-page-witnesses
          path: build/repro/kropotkin-page-witnesses.json
          if-no-files-found: error
          retention-days: 7
      - name: Capture exact front-matter Page witnesses without retaining prose
        run: python -m scriptorium.kropotkin_page_witnesses --frontmatter --output build/repro/kropotkin-frontmatter-witnesses.json
      - name: Verify supplemental coverage and separation from accepted replay
        run: |
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          from scriptorium.kropotkin_page_witnesses import FRONT_IDS
          root = Path("build/repro")
          partial = (root / "kropotkin-page-witnesses.json").read_bytes()
          selectors = (root / "kropotkin-body-preflight.json").read_bytes()
          front = json.loads((root / "kropotkin-frontmatter-witnesses.json").read_bytes())
          old = json.loads(partial)
          assert front["selector_receipt_sha256"] == sha256(selectors).hexdigest()
          assert front["partial_receipt_sha256"] == sha256(partial).hexdigest()
          assert [r["revision_id"] for r in front["pages"]] == list(FRONT_IDS)
          assert [r["scan_page"] for r in front["pages"]] == [5, *range(11, 23)]
          assert front["page_count"] == 13
          assert sorted(front["candidate_scan_pages"] + old["candidate_scan_pages"]) == json.loads(selectors)["candidate_scan_page_union"]
          assert len({r["revision_id"] for r in front["pages"] + old["pages"]}) == 338
          assert not front["body_frozen"] and not front["source_text_retained"]
          assert not front["effective_page_graph_verified"]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kropotkin-frontmatter-witnesses
          path: build/repro/kropotkin-frontmatter-witnesses.json
          if-no-files-found: error
          retention-days: 7
      - run: python -m unittest discover -s tests -p test_kropotkin_rendered.py -v
      - name: Extract modern rendered route candidates in memory
        run: python -m scriptorium.kropotkin_rendered --selectors build/repro/kropotkin-body-preflight.json --output build/repro/kropotkin-rendered-diagnostic.json
      - name: Verify diagnostic envelope without claiming body acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scriptorium.kropotkin_body_preflight import REVISION_IDS
          r = json.loads(Path("build/repro/kropotkin-rendered-diagnostic.json").read_text())
          assert r["route_count"] == 29
          assert [x["revision_id"] for x in r["routes"]] == list(REVISION_IDS)
          assert not r["body_frozen"] and not r["source_text_retained"]
          assert not r["m2_parity_admissible"]
          assert (r["candidate_composite_characters"] is not None) == (r["extracted_route_count"] == 29)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kropotkin-rendered-diagnostic
          path: build/repro/kropotkin-rendered-diagnostic.json
          if-no-files-found: error
          retention-days: 7
      - run: python -m unittest discover -s tests -p test_kropotkin_appendix_gap.py -v
      - name: Diagnose exact Appendix XIII variants without substituting prose
        run: python -m scriptorium.kropotkin_appendix_gap --selectors build/repro/kropotkin-body-preflight.json --witnesses build/repro/kropotkin-page-witnesses.json --output build/repro/kropotkin-appendix-gap.json
      - name: Verify separate variant and provenance envelope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("build/repro/kropotkin-appendix-gap.json").read_text())
          assert [x["revision_id"] for x in r["identities"]] == [3485514, 3485499, 5800299]
          assert [x["variant"] for x in r["variants"]] == ["modern", "historical"]
          assert r["accepted_page_and_modern_route_replayed"]
          assert not any(r[k] for k in ("normalization_performed", "body_frozen", "source_text_retained", "m2_parity_admissible", "effective_page_graph_verified"))
          assert r["body_characters"] is None
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kropotkin-appendix-gap
          path: build/repro/kropotkin-appendix-gap.json
          if-no-files-found: error
          retention-days: 7
