name: Scriptorium pinned pylem provider

on:
  pull_request:
    paths:
      - ".github/workflows/morphology-provider.yml"
      - "requirements/pylem-0.0.18.txt"
      - "scriptorium/morphology.py"
      - "scriptorium/morphology_diagnostic.py"
      - "scriptorium/homonym_weight_diagnostic.py"
      - "scriptorium/methodology_pos_diagnostic.py"
      - "scriptorium/pylem_provider.py"
      - "scriptorium/pylem_transport.py"
      - "scriptorium/text.py"
      - "scriptorium/wikisource_replay.py"
      - "tests/test_morphology.py"
      - "tests/test_morphology_diagnostic.py"
      - "tests/test_homonym_weight_diagnostic.py"
      - "tests/test_methodology_pos_diagnostic.py"
      - "tests/test_pylem_provider.py"
      - "tests/test_pylem_transport.py"
      - "tools/pylem_runtime_probe.py"
      - "tools/pylem_sidecar.py"
      - "benchmarks/fantlab/work270306.json"
      - "corpus/candidates/source-edition-traces/tolstoy-anna-karenina-ru.revisions.json"
      - "public-artifacts/tolstoy-anna-karenina-ru-morphology-diagnostic.json"
      - "docs/AOT_PYLEM_COMPATIBILITY.md"
      - "docs/FANTLAB_POS_SURFACES.md"
      - "project/STATE_AND_QUEUE.md"
      - "project/CHANGELOG.d/SCRIP-MORPH-003.md"
      - "project/CHANGELOG.d/SCRIP-MORPH-004.md"
      - "project/CHANGELOG.d/SCRIP-MORPH-005.md"
      - "project/CHANGELOG.d/SCRIP-MORPH-006.md"
      - "project/CHANGELOG.d/SCRIP-MORPH-007.md"
      - "project/CHANGELOG.d/SCRIP-MORPH-008.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Verify Scriptorium provider contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run complete standard-library test suite
        run: python -m unittest discover -s tests -v

  native-pylem-smoke:
    name: Build and execute pinned pylem 0.0.18
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: Record build toolchain
        run: |
          set -euo pipefail
          python --version
          cmake --version
          c++ --version

      - name: Install hash-pinned pylem source distribution
        env:
          CMAKE_ARGS: "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
        run: |
          set -euo pipefail
          mkdir -p build/morph
          python -m pip install -vv --disable-pip-version-check --no-deps --require-hashes \
            -r requirements/pylem-0.0.18.txt 2>&1 | tee build/morph/pylem-install.log
          python - <<'PY'
          from importlib.metadata import version
          assert version("pylem") == "0.0.18", version("pylem")
          PY

      - name: Upload install failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scriptorium-pylem-install-log
          path: build/morph/pylem-install.log
          if-no-files-found: error
          retention-days: 7

      - name: Execute isolated native provider smoke
        run: |
          set -euo pipefail
          mkdir -p build/morph
          python tools/pylem_runtime_probe.py \
            --receipt build/morph/pylem-runtime-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("build/morph/pylem-runtime-receipt.json").read_text(encoding="utf-8"))
          assert receipt["provider"]["distribution"] == "pylem"
          assert receipt["provider"]["version"] == "0.0.18"
          assert receipt["provider"]["runtime_profile"] == "pylem-0.0.18-python39-sidecar-v1"
          assert receipt["fixture"]["source_text_included"] is False
          assert receipt["fixture"]["token_count"] == 3
          assert receipt["epistemic_boundary"]["fantlab_dictionary_equivalence"] == "unknown"
          assert receipt["epistemic_boundary"]["m2_parity_admissible"] is False
          print(json.dumps(receipt, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY

      - name: Upload source-free runtime receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scriptorium-pylem-runtime-receipt
          path: build/morph/pylem-runtime-receipt.json
          if-no-files-found: error
          retention-days: 7

  frozen-pos-diagnostic:
    name: Replay frozen Anna Karenina through isolated pylem sidecar
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13 contract runtime
        id: py313
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Prepare ephemeral frozen-work sidecar request
        run: |
          set -euo pipefail
          mkdir -p build/morph
          "${{ steps.py313.outputs.python-path }}" -m scriptorium.pylem_transport prepare \
            --manifest corpus/candidates/source-edition-traces/tolstoy-anna-karenina-ru.revisions.json \
            --request build/morph/anna-pylem-request.json

      - name: Set up Python 3.9 legacy provider runtime
        id: py39
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: Install exact pylem sidecar dependency
        env:
          CMAKE_ARGS: "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
        run: |
          set -euo pipefail
          "${{ steps.py39.outputs.python-path }}" -m pip install --disable-pip-version-check \
            --no-deps --require-hashes -r requirements/pylem-0.0.18.txt

      - name: Execute sidecar over exact Scriptorium tokens
        run: |
          set -euo pipefail
          "${{ steps.py39.outputs.python-path }}" tools/pylem_sidecar.py \
            --request build/morph/anna-pylem-request.json \
            --response build/morph/anna-pylem-response.json

      - name: Build source-free frozen POS diagnostic
        env:
          SCRIPTORIUM_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          "${{ steps.py313.outputs.python-path }}" -m scriptorium.pylem_transport finalize \
            --manifest corpus/candidates/source-edition-traces/tolstoy-anna-karenina-ru.revisions.json \
            --reference benchmarks/fantlab/work270306.json \
            --request build/morph/anna-pylem-request.json \
            --response build/morph/anna-pylem-response.json \
            --scriptorium-revision "$SCRIPTORIUM_REVISION" \
            --output build/morph/work270306-pylem-pos-diagnostic.json
          "${{ steps.py313.outputs.python-path }}" - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path("build/morph/work270306-pylem-pos-diagnostic.json").read_text(encoding="utf-8"))
          assert artifact["schema_version"] == "scriptorium-frozen-pos-diagnostic-v2"
          assert artifact["source_text_included"] is False
          assert artifact["diagnostic_boundary"]["status"] == "diagnostic_only"
          assert artifact["diagnostic_boundary"]["fantlab_source_edition_match"] == "unknown"
          assert artifact["diagnostic_boundary"]["fantlab_dictionary_equivalence"] == "unknown"
          assert artifact["diagnostic_boundary"]["m2_parity_admissible"] is False
          assert artifact["pos"]["runtime_profile"] == "pylem-0.0.18-python39-sidecar-v1"
          decomposition = artifact["undefined_decomposition"]
          assert decomposition["status"] == "diagnostic_only"
          assert sum(decomposition["undefined_reason_counts"].values()) == decomposition["undefined_count"]
          assert decomposition["defined_count"] + decomposition["undefined_count"] == decomposition["token_count"]
          assert artifact["fantlab_pos_accounting"]["status"] == "diagnostic_only"
          print(json.dumps({
              "candidate_id": artifact["candidate_id"],
              "normalized_sha256": artifact["transport"]["normalized_sha256"],
              "runtime_analysis_sha256": artifact["transport"]["runtime_analysis_sha256"],
              "defined": artifact["pos"]["metrics"]["defined"],
              "undefined": artifact["pos"]["metrics"]["undefined"],
              "undefined_decomposition": decomposition,
              "fantlab_pos_accounting": artifact["fantlab_pos_accounting"],
              "m2_parity_admissible": False,
          }, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY

      - name: Build source-free homonym-weight signal diagnostic
        env:
          SCRIPTORIUM_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          "${{ steps.py313.outputs.python-path }}" -m scriptorium.homonym_weight_diagnostic \
            --manifest corpus/candidates/source-edition-traces/tolstoy-anna-karenina-ru.revisions.json \
            --request build/morph/anna-pylem-request.json \
            --response build/morph/anna-pylem-response.json \
            --scriptorium-revision "$SCRIPTORIUM_REVISION" \
            --output build/morph/work270306-pylem-homonym-weight-diagnostic.json
          "${{ steps.py313.outputs.python-path }}" - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path("build/morph/work270306-pylem-homonym-weight-diagnostic.json").read_text(encoding="utf-8"))
          assert artifact["schema_version"] == "scriptorium-frozen-homonym-weight-diagnostic-v1"
          assert artifact["source_text_included"] is False
          assert artifact["diagnostic_boundary"]["status"] == "diagnostic_only"
          assert artifact["diagnostic_boundary"]["fantlab_homonym_selection"] == "unresolved"
          assert artifact["diagnostic_boundary"]["production_resolution_changed"] is False
          assert artifact["diagnostic_boundary"]["m2_parity_admissible"] is False
          signal = artifact["signal"]
          assert signal["status"] == "diagnostic_only"
          assert signal["evidence_boundary"]["production_homonym_selection_changed"] is False
          assert signal["homonym_weight_complete_count"] + signal["homonym_weight_missing_count"] == signal["direct_cross_bucket_ambiguity_count"]
          assert signal["unique_max_bucket_count"] + signal["tied_max_bucket_count"] == signal["homonym_weight_complete_count"]
          print(json.dumps({
              "candidate_id": artifact["candidate_id"],
              "normalized_sha256": artifact["normalized_sha256"],
              "signal": signal,
              "m2_parity_admissible": False,
          }, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY

      - name: Build source-free full-methodology POS diagnostic
        env:
          SCRIPTORIUM_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          "${{ steps.py313.outputs.python-path }}" -m scriptorium.methodology_pos_diagnostic \
            --manifest corpus/candidates/source-edition-traces/tolstoy-anna-karenina-ru.revisions.json \
            --request build/morph/anna-pylem-request.json \
            --response build/morph/anna-pylem-response.json \
            --scriptorium-revision "$SCRIPTORIUM_REVISION" \
            --output build/morph/work270306-pylem-methodology-pos-diagnostic.json
          "${{ steps.py313.outputs.python-path }}" - <<'PY'
          import json
          from pathlib import Path
          artifact = json.loads(Path("build/morph/work270306-pylem-methodology-pos-diagnostic.json").read_text(encoding="utf-8"))
          assert artifact["schema_version"] == "scriptorium-frozen-fantlab-methodology-pos-diagnostic-v1"
          assert artifact["source_text_included"] is False
          assert artifact["diagnostic_boundary"]["status"] == "diagnostic_only"
          assert artifact["diagnostic_boundary"]["fantlab_source_edition_match"] == "unknown"
          assert artifact["diagnostic_boundary"]["current_work_page_surface_relation"] == "unknown"
          assert artifact["diagnostic_boundary"]["production_pos_profile_changed"] is False
          assert artifact["diagnostic_boundary"]["m2_parity_admissible"] is False
          assert artifact["transport"]["runtime_profile"] == "pylem-0.0.18-python39-sidecar-v1"
          assert artifact["transport"]["normalized_sha256"] == "1dcf2af815f6288099f77a038d873690fb0dc72edf81d2094fd29f3d5a30c205"
          signal = artifact["methodology_pos"]
          assert signal["transport"] == artifact["transport"]
          assert signal["status"] == "diagnostic_only"
          assert signal["defined_count"] + signal["undefined_count"] == signal["token_count"]
          assert signal["defined_count"] - signal["observed_work_page_surface_defined_count"] == signal["additional_methodology_defined_count"]
          assert sum(signal["extra_methodology_bucket_counts"].values()) == signal["additional_methodology_defined_count"]
          assert signal["evidence_boundary"]["runtime_n_resolution"] == "unresolved"
          assert signal["evidence_boundary"]["fantlab_homonym_selection"] == "unresolved"
          assert signal["evidence_boundary"]["m2_parity_admissible"] is False
          print(json.dumps({
              "candidate_id": artifact["candidate_id"],
              "transport": artifact["transport"],
              "token_count": signal["token_count"],
              "defined_count": signal["defined_count"],
              "undefined_count": signal["undefined_count"],
              "observed_work_page_surface_defined_count": signal["observed_work_page_surface_defined_count"],
              "additional_methodology_defined_count": signal["additional_methodology_defined_count"],
              "extra_methodology_bucket_counts": signal["extra_methodology_bucket_counts"],
              "m2_parity_admissible": False,
          }, ensure_ascii=False, sort_keys=True, separators=(",", ":")))
          PY

      - name: Remove ephemeral source-bearing transport files
        if: always()
        run: rm -f build/morph/anna-pylem-request.json build/morph/anna-pylem-response.json

      - name: Upload source-free frozen POS diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scriptorium-anna-pylem-pos-diagnostic
          path: build/morph/work270306-pylem-pos-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload source-free homonym-weight diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scriptorium-anna-pylem-homonym-weight-diagnostic
          path: build/morph/work270306-pylem-homonym-weight-diagnostic.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload source-free full-methodology POS diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scriptorium-anna-pylem-methodology-pos-diagnostic
          path: build/morph/work270306-pylem-methodology-pos-diagnostic.json
          if-no-files-found: error
          retention-days: 7
