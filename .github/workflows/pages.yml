name: Scriptorium Pages

on:
  pull_request:
    paths:
      - "index.html"
      - "word-density.html"
      - "metrics.html"
      - "assets/**"
      - "voice/**"
      - ".github/workflows/pages.yml"
      - "scriptorium/**"
      - "site/**"
      - "showcase/**"
      - "benchmarks/**"
      - "public-artifacts/**"
      - "corpus/candidates/source-edition-traces/**"
      - "schemas/**"
      - "tests/**"
  push:
    branches:
      - master
    paths:
      - "index.html"
      - "word-density.html"
      - "metrics.html"
      - "assets/**"
      - "voice/**"
      - ".github/workflows/pages.yml"
      - "scriptorium/**"
      - "site/**"
      - "showcase/**"
      - "benchmarks/**"
      - "public-artifacts/**"
      - "corpus/candidates/source-edition-traces/**"
      - "schemas/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scriptorium-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build static site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v

      - name: Audit branch-published Reader routes and downloads
        run: python -m scriptorium.branch_pages_audit --repo-root .

      - name: Verify frozen source-bound author preview
        run: python -m scriptorium.voice_profile --check assets/voice-preview.json

      - name: Check root Reader JavaScript syntax
        run: node --check assets/pages-reader.js

      - name: Verify exact source-backed no-script paired table
        run: node tests/pages_pair_static_fallback_smoke.cjs

      - name: Verify full source-backed no-script single-book table
        run: node tests/pages_single_static_fallback_smoke.cjs

      - name: Check metric-to-definition deep links
        run: node tests/pages_metric_deep_link_smoke.cjs

      - name: Verify source-bound comparison permalink copy
        run: node tests/pages_pair_copy_smoke.cjs

      - name: Build canonical Pages artifact
        run: python -m scriptorium.site_renderer --repo-root . --output build/site

      - name: Verify deterministic rebuild
        shell: bash
        run: |
          set -euo pipefail
          python -m scriptorium.site_renderer --repo-root . --output build/site-check
          diff -qr build/site build/site-check
          rm -rf build/site-check
          test -z "$(find build/site -type l -print -quit)"

      - name: Stage exact branch-root Reader preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/branch-root-preview/assets build/branch-root-preview/voice
          cp index.html build/branch-root-preview/index.html
          cp word-density.html build/branch-root-preview/word-density.html
          cp metrics.html build/branch-root-preview/metrics.html
          cp assets/pages-reader.css build/branch-root-preview/assets/pages-reader.css
          cp assets/pages-reader.js build/branch-root-preview/assets/pages-reader.js
          cp assets/evidence-snapshot.json build/branch-root-preview/assets/evidence-snapshot.json
          cp assets/scriptorium-ru-measured-metrics.csv build/branch-root-preview/assets/scriptorium-ru-measured-metrics.csv
          cp assets/voice-preview.json build/branch-root-preview/assets/voice-preview.json
          cp voice/index.html build/branch-root-preview/voice/index.html
          cp voice/holdout-three.csv build/branch-root-preview/voice/holdout-three.csv
          test -s build/branch-root-preview/index.html
          test -s build/branch-root-preview/word-density.html
          test -s build/branch-root-preview/metrics.html
          test -s build/branch-root-preview/assets/evidence-snapshot.json
          test -s build/branch-root-preview/assets/scriptorium-ru-measured-metrics.csv
          test -s build/branch-root-preview/assets/voice-preview.json
          test -s build/branch-root-preview/voice/index.html
          test -s build/branch-root-preview/voice/holdout-three.csv
          cmp assets/scriptorium-ru-measured-metrics.csv build/branch-root-preview/assets/scriptorium-ru-measured-metrics.csv
          cmp assets/voice-preview.json build/branch-root-preview/assets/voice-preview.json
          cmp metrics.html build/branch-root-preview/metrics.html
          cmp voice/index.html build/branch-root-preview/voice/index.html
          cmp voice/holdout-three.csv build/branch-root-preview/voice/holdout-three.csv
          test -z "$(find build/branch-root-preview -type l -print -quit)"

      - name: Upload exact branch-root Reader preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scriptorium-branch-root-preview
          path: build/branch-root-preview
          if-no-files-found: error
          retention-days: 7

      # This exercises the exact branch-root Reader, not the separate build/site
      # artifact and not the deployed public URL. Keep external manuscripts out.
      - name: Install pinned Chromium acceptance runner
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Exercise Reader on desktop, mobile, keyboard and A4
        run: node tests/pages_browser_acceptance.cjs

      - name: Archive actual Chromium screenshots and print PDF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scriptorium-browser-acceptance
          path: build/reader-browser-acceptance
          if-no-files-found: warn
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request' &&
      vars.SCRIPTORIUM_PAGES_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
