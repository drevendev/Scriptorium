name: Perelman 1913 OCR promotion contract

on:
  pull_request:
    paths:
      - ".github/workflows/perelman-ocr-contract.yml"
      - "scriptorium/perelman_ocr_contract.py"
      - "tests/test_perelman_ocr_contract.py"
      - "corpus/candidates/perelman-entertaining-physics-book1-1913-ru.md"
      - "corpus/candidates/source-edition-traces/perelman-entertaining-physics-book1-1913-ru.json"
      - "corpus/candidates/source-edition-traces/perelman-entertaining-physics-book1-1913-ru.ocr-contract.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate source-free promotion boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run focused fail-closed tests
        run: python -m unittest tests.test_perelman_ocr_contract -v

      - name: Validate committed source-free contract
        run: |
          set -euo pipefail
          result="$(python -m scriptorium.perelman_ocr_contract validate corpus/candidates/source-edition-traces/perelman-entertaining-physics-book1-1913-ru.ocr-contract.json)"
          printf '%s\n' "$result"
          python - "$result" <<'PY'
          import json
          import sys
          result = json.loads(sys.argv[1])
          assert result["contract_sha256"] == "f709f2fd298252c3edaf8eaf04fc53955186d48df1f2c2b24d1962d1729ee7e5"
          assert result["scan_sha256"] == "3d87d22a42ad949654265e066f81211d7831e32c8b62b96c967cd4cd33e7ed61"
          assert result["page_selection_status"] == "unbound"
          assert result["rasterization_status"] == "unbound"
          assert result["ocr_status"] == "unbound"
          assert result["literary_body_frozen"] is False
          assert result["minimum_300k_proved_from_frozen_body"] is False
          assert result["m2_parity_admissible"] is False
          PY
