name: Perelman 1913 PDF facsimile review

on:
  pull_request:
    paths:
      - ".github/workflows/perelman-pdf-facsimile-review.yml"
      - "corpus/candidates/perelman-entertaining-physics-book1-1913-ru.pdf-facsimile-transition-tail.md"
      - "corpus/candidates/source-edition-traces/perelman-entertaining-physics-book1-1913-ru.pdf-facsimile-transition-tail.json"
      - "tests/test_perelman_pdf_facsimile_transition_tail.py"
      - "corpus/candidates/perelman-entertaining-physics-book1-1913-ru.pdf-facsimile-interior.md"
      - "corpus/candidates/source-edition-traces/perelman-entertaining-physics-book1-1913-ru.pdf-facsimile-interior.json"
      - "tests/test_perelman_pdf_facsimile_interior.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-review-pages:
    name: Verify exact PDF and render bounded review pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Ensure PDF renderer is available
        run: |
          set -euo pipefail
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdftoppm -v

      - name: Retrieve and verify exact frozen Commons PDF
        env:
          PDF_URL: https://upload.wikimedia.org/wikipedia/commons/8/8c/%D0%9F%D0%B5%D1%80%D0%B5%D0%BB%D1%8C%D0%BC%D0%B0%D0%BD_%D0%AF.%D0%98._%D0%97%D0%B0%D0%BD%D0%B8%D0%BC%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%B0%D1%8F_%D1%84%D0%B8%D0%B7%D0%B8%D0%BA%D0%B0._%D0%9A%D0%BD%D0%B8%D0%B3%D0%B0_1_%281913%29.pdf
        run: |
          set -euo pipefail
          mkdir -p build/facsimile
          curl --fail --location --retry 3 --user-agent 'Scriptorium provenance research/1.0 (+https://github.com/drevendev/Scriptorium)' "$PDF_URL" --output build/facsimile/perelman-1913.pdf
          test "$(stat -c%s build/facsimile/perelman-1913.pdf)" = "28168847"
          echo '3c616f547ff283a2cafd1ac26b448a8e8013f648  build/facsimile/perelman-1913.pdf' | sha1sum --check --strict
          echo '3d87d22a42ad949654265e066f81211d7831e32c8b62b96c967cd4cd33e7ed61  build/facsimile/perelman-1913.pdf' | sha256sum --check --strict

      - name: Render bounded transition, interior, and tail pages
        run: |
          set -euo pipefail
          pdftoppm -f 9 -l 13 -r 120 -jpeg build/facsimile/perelman-1913.pdf build/facsimile/transition
          pdftoppm -f 199 -l 206 -r 120 -jpeg build/facsimile/perelman-1913.pdf build/facsimile/interior
          pdftoppm -f 217 -l 223 -r 120 -jpeg build/facsimile/perelman-1913.pdf build/facsimile/tail
          rm build/facsimile/perelman-1913.pdf
          (cd build/facsimile && sha256sum transition-*.jpg interior-*.jpg tail-*.jpg | sort) > build/facsimile/rendered-pages.sha256
          printf 'Rendered files:\n'
          cat build/facsimile/rendered-pages.sha256

      - name: Run retained source-free regressions when present
        run: |
          set -euo pipefail
          if test -f tests/test_perelman_pdf_facsimile_transition_tail.py; then
            python -m unittest tests.test_perelman_pdf_facsimile_transition_tail -v
          fi
          if test -f tests/test_perelman_pdf_facsimile_interior.py; then
            python -m unittest tests.test_perelman_pdf_facsimile_interior -v
          fi

      - name: Upload transient facsimile review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perelman-1913-facsimile-review
          path: |
            build/facsimile/transition-*.jpg
            build/facsimile/interior-*.jpg
            build/facsimile/tail-*.jpg
            build/facsimile/rendered-pages.sha256
          if-no-files-found: error
          retention-days: 1
