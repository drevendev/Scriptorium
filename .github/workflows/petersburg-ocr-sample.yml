name: Petersburg 1916 bounded OCR sample

on:
  pull_request:
    paths:
      - ".github/workflows/petersburg-ocr-sample.yml"
      - "scriptorium/petersburg_ocr_sample.py"
      - "scriptorium/petersburg_ocr_contract.py"
      - "tests/test_petersburg_ocr_sample.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run offline regression tests
        run: python -m unittest tests.test_petersburg_ocr_sample -v
      - name: Install required OCR tools
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-rus
          test -f /usr/share/tesseract-ocr/5/tessdata/rus.traineddata
      - name: Compare two segmentation modes on seven exact carrier pages
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --max-time 120 --max-filesize 3621459 \
            --user-agent 'Scriptorium research (https://github.com/drevendev/Scriptorium)' \
            'https://upload.wikimedia.org/wikipedia/commons/3/3c/%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B9_%D0%91%D0%B5%D0%BB%D1%8B%D0%B9._%D0%9F%D0%B5%D1%82%D0%B5%D1%80%D0%B1%D1%83%D1%80%D0%B3_%281916%29.pdf' \
            -o "$temp/carrier.pdf"
          python -m scriptorium.petersburg_ocr_sample "$temp/carrier.pdf" --tessdata /usr/share/tesseract-ocr/5/tessdata > "$temp/receipt.json"
          python - "$temp/receipt.json" <<'PY'
          import json, sys
          from pathlib import Path
          r = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert r["source_free"] and r["accuracy_status"] == "UNVERIFIED"
          assert not r["whole_volume_ocr_authorized_by_sample"]
          assert [x["physical_page"] for x in r["pages"]] == [1, 21, 22, 160, 320, 480, 600]
          for row in r["pages"]:
              assert row["reference_status"] == "NOT_RUN"
              assert [v["psm"] for v in row["variants"]] == [3, 6]
              assert all(v["reference_errors"] is None for v in row["variants"])
              assert all(0 <= v["non_whitespace_codepoints"] <= v["raw_codepoints"] for v in row["variants"])
          for gate in ("literary_body_frozen", "minimum_300k_proved_from_frozen_body",
                       "admitted_for_calibration", "m2_parity_admissible"):
              assert r[gate] is False
          assert r["fantlab_source_edition_match"] == "unknown"
          PY
          mkdir -p build/repro
          cp "$temp/receipt.json" build/repro/bely-petersburg-1916-ru.ocr-sample.json
      - name: Upload counts and hashes only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: petersburg-1916-ocr-sample
          path: build/repro/bely-petersburg-1916-ru.ocr-sample.json
          if-no-files-found: error
          retention-days: 7
