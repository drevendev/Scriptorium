name: Petersburg 1916 scan identity

on:
  pull_request:
    paths:
      - ".github/workflows/petersburg-scan-identity.yml"
      - "scriptorium/petersburg_scan_identity.py"
      - "tests/test_petersburg_scan_identity.py"
      - "tests/test_petersburg_provenance_trace.py"
      - "corpus/candidates/README.md"
      - "corpus/candidates/bely-petersburg-1916-ru.md"
      - "corpus/candidates/source-edition-traces/bely-petersburg-1916-ru.json"
      - "corpus/candidates/source-edition-traces/bely-petersburg-1916-ru.scan-identity.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-identity:
    name: Retrieve and verify exact Commons PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run scan-identity and provenance tests
        run: python -m unittest tests.test_petersburg_scan_identity tests.test_petersburg_provenance_trace -v

      - name: Independently retrieve and verify exact Commons original
        run: |
          set -euo pipefail
          mkdir -p build/repro
          python -m scriptorium.petersburg_scan_identity verify \
            --receipt corpus/candidates/source-edition-traces/bely-petersburg-1916-ru.scan-identity.json \
            | tee build/repro/bely-petersburg-1916-ru.scan-identity.verify.json

      - name: Verify gate boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("corpus/candidates/source-edition-traces/bely-petersburg-1916-ru.scan-identity.json").read_text(encoding="utf-8"))
          assert receipt["candidate_id"] == "bely-petersburg-1916-ru"
          assert receipt["edition_identity"] == "1916_first_book_edition_facsimile"
          assert receipt["identity"]["byte_count"] == 3621459
          assert receipt["identity"]["sha1"] == "682476934dd6ed49c6bbcdb0720127c1812ff477"
          assert receipt["identity"]["sha256"] == "b08820ad1339894c6d20fbaa2367c11385492bf376d199f8de23c859ef6ddef5"
          assert receipt["binary_bytes_committed"] is False
          assert receipt["ocr_included"] is False
          assert receipt["literary_source_text_included"] is False
          assert receipt["ocr_extraction_profile_frozen"] is False
          assert receipt["literary_body_count_and_digests_frozen"] is False
          assert receipt["minimum_300k_proved_from_frozen_body"] is False
          assert receipt["admitted_for_calibration"] is False
          assert receipt["fantlab_source_edition_match"] == "unknown"
          assert receipt["diagnostic_ready"] is False
          assert receipt["m2_parity_admissible"] is False
          print("SCRIPTORIUM_PETERSBURG_SCAN_SHA256=" + receipt["identity"]["sha256"])
          PY

      - name: Upload source-free scan identity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: petersburg-1916-scan-identity
          path: |
            corpus/candidates/source-edition-traces/bely-petersburg-1916-ru.scan-identity.json
            build/repro/bely-petersburg-1916-ru.scan-identity.verify.json
          if-no-files-found: error
          retention-days: 7
