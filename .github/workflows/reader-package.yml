name: Scriptorium Reader package

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "scriptorium/**"
      - "tests/**"
      - "tools/reader_package_smoke.py"
      - "tools/private_compare_smoke.py"
      - "tools/private_batch_smoke.py"
      - "tools/private_epub_smoke.py"
      - ".github/workflows/reader-package.yml"
  push:
    branches: [master]
    paths:
      - "pyproject.toml"
      - "scriptorium/**"
      - "tests/**"
      - "tools/reader_package_smoke.py"
      - "tools/private_compare_smoke.py"
      - "tools/private_batch_smoke.py"
      - "tools/private_epub_smoke.py"
      - ".github/workflows/reader-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Check Python syntax before test discovery
        run: python -m compileall -q scriptorium tests tools
      - name: Run complete canonical suite
        run: python -m unittest discover -s tests -v
      - name: Build and install reader wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m venv "$RUNNER_TEMP/reader-venv"
          "$RUNNER_TEMP/reader-venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
      - name: Exercise installed package outside checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/reader-venv/bin/python" -I "$GITHUB_WORKSPACE/tools/reader_package_smoke.py" "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/reader-venv/bin/scriptorium" --help
      - name: Verify bundled author rhythm from outside checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/reader-venv/bin/scriptorium" voice --format markdown > voice-installed.md
          test -s voice-installed.md
          grep -q "M2: 0/5; M3: открыт" voice-installed.md
          "$RUNNER_TEMP/reader-venv/bin/scriptorium" voice --check "$GITHUB_WORKSPACE/assets/voice-preview.json"
          "$RUNNER_TEMP/reader-venv/bin/scriptorium" voice --ablate --format markdown > voice-ablation.md
          grep -q "M2: 0/5; M3: открыт" voice-ablation.md
          "$RUNNER_TEMP/reader-venv/bin/scriptorium" voice --ablate --format json > voice-ablation.json
          "$RUNNER_TEMP/reader-venv/bin/python" - <<'PY'
          import json
          with open("voice-ablation.json", encoding="utf-8") as evidence:
              result = json.load(evidence)
          assert result["schema_version"] == "scriptorium-author-rhythm-feature-ablation-v1"
          assert result["baseline_summary"]["nearer_to_labelled_author"] == 1
          assert [row["summary"]["nearer_to_labelled_author"] for row in result["ablations"]] == [1, 1, 1, 1, 1, 1, 2, 1]
          assert result["scientific_boundary"]["m3_accepted"] is False
          PY

      - name: Exercise private comparison with the installed analyzer
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/reader-venv/bin/python" -I "$GITHUB_WORKSPACE/tools/private_compare_smoke.py" "$GITHUB_WORKSPACE"
      - name: Exercise installed private batch, retry and partial failure
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/reader-venv/bin/python" -I "$GITHUB_WORKSPACE/tools/private_batch_smoke.py" "$GITHUB_WORKSPACE"
      - name: Exercise installed private EPUB analysis and compare
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/reader-venv/bin/python" -I "$GITHUB_WORKSPACE/tools/private_epub_smoke.py" "$GITHUB_WORKSPACE"
      - name: Verify EPUB rejection and encoding boundaries in installed wheel
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/reader-venv/bin/python" -I "$GITHUB_WORKSPACE/tests/test_epub_boundaries.py" -v
      - name: Verify installed source-free gallery and deterministic output
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          for format in html csv; do
            "$RUNNER_TEMP/reader-venv/bin/python" -I -m scriptorium.full_work_gallery --repo-root "$GITHUB_WORKSPACE" --format "$format" > "gallery.$format"
            "$RUNNER_TEMP/reader-venv/bin/python" -I -m scriptorium.full_work_gallery --repo-root "$GITHUB_WORKSPACE" --format "$format" > "gallery-check.$format"
            cmp "gallery.$format" "gallery-check.$format"
            test -s "gallery.$format"
          done
