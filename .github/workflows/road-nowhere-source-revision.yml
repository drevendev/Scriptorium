name: Road to Nowhere alternate source revision

on:
  pull_request:
    paths:
      - ".github/workflows/road-nowhere-source-revision.yml"
      - "scriptorium/single_page_revision.py"
      - "scriptorium/single_page_body.py"
      - "scriptorium/wikisource_freeze.py"
      - "tests/test_single_page_revision.py"
      - "tests/test_single_page_body.py"
      - "corpus/candidates/source-edition-traces/grin-road-nowhere-ru.json"
      - "corpus/candidates/source-edition-traces/grin-road-nowhere-ru.alternate-revision.json"
      - "corpus/candidates/source-edition-traces/grin-road-nowhere-ru.alternate-body.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    name: Replay pinned alternate source revision and literary body
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v

      - name: Capture exact pinned revision identity without source prose
        run: |
          set -euo pipefail
          mkdir -p build/repro
          python -m scriptorium.single_page_revision capture \
            --candidate-id grin-road-nowhere-ru \
            --title 'Дорога в никуда (Грин)' \
            --revision-id 5585836 \
            --source-work-url 'https://ru.wikisource.org/wiki/Дорога_в_никуда_(Грин)' \
            --permanent-source-url 'https://ru.wikisource.org/w/index.php?title=Дорога_в_никуда_(Грин)&oldid=5585836' \
            --bibliographic-source 'az.lib.ru single-page transcription; Wikisource publication year 1930' \
            --legal-basis public_domain \
            --output build/repro/grin-road-nowhere-ru.alternate-revision.observed.json

      - name: Compare committed source-free revision identity
        run: |
          set -euo pipefail
          expected='corpus/candidates/source-edition-traces/grin-road-nowhere-ru.alternate-revision.json'
          observed='build/repro/grin-road-nowhere-ru.alternate-revision.observed.json'
          cmp "$expected" "$observed"
          python -m scriptorium.single_page_revision replay \
            --manifest "$expected" \
            --receipt build/repro/grin-road-nowhere-ru.alternate-revision.replay.json

      - name: Probe pinned source shape without printing prose
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          import re
          from scriptorium.single_page_body import fetch_pinned_wikitext

          observed = fetch_pinned_wikitext(title='Дорога в никуда (Грин)', revision_id=5585836)
          source = observed.pop('wikitext')
          template_names = Counter(
              name.strip().casefold()
              for name in re.findall(r'\{\{\s*([^|{}\n]+)', source)
          )
          heading_levels = Counter(
              len(marker)
              for marker in re.findall(r'(?m)^\s*(={2,6})(?!=).*?\1\s*$', source)
          )
          tag_names = Counter(
              name.casefold()
              for name in re.findall(r'<\/?\s*([A-Za-z][A-Za-z0-9:-]*)\b[^>]*>', source)
          )
          div_classes = Counter(
              value.casefold()
              for value in re.findall(r'<div\b[^>]*\bclass=["\']([^"\']+)["\'][^>]*>', source, re.I)
          )
          category_lines = len(re.findall(r'(?mi)^\s*\[\[\s*Категория\s*:[^\]\n]+\]\]\s*$', source))
          report = {
              'source_identity': observed,
              'line_count': source.count('\n') + 1,
              'leading_template_name': next(iter(re.findall(r'^\s*\{\{\s*([^|{}\n]+)', source)), None),
              'template_name_counts': dict(sorted(template_names.items())),
              'heading_level_counts': {str(key): value for key, value in sorted(heading_levels.items())},
              'html_tag_name_counts': dict(sorted(tag_names.items())),
              'div_class_counts': dict(sorted(div_classes.items())),
              'category_line_count': category_lines,
              'wikilink_open_count': source.count('[['),
              'wikilink_close_count': source.count(']]'),
              'comment_open_count': source.count('<!--'),
              'comment_close_count': source.count('-->'),
              'bold_italic_marker_count': source.count("''"),
              'noinclude_open_count': len(re.findall(r'<noinclude\b', source, re.I)),
              'onlyinclude_open_count': len(re.findall(r'<onlyinclude\b', source, re.I)),
          }
          print('SCRIPTORIUM_ROAD_NOWHERE_SHAPE=' + json.dumps(report, ensure_ascii=False, sort_keys=True, separators=(',', ':')))
          PY

      - name: Capture source-free literary-body identity
        run: |
          set -euo pipefail
          revision='corpus/candidates/source-edition-traces/grin-road-nowhere-ru.alternate-revision.json'
          expected='corpus/candidates/source-edition-traces/grin-road-nowhere-ru.alternate-body.json'
          observed='build/repro/grin-road-nowhere-ru.alternate-body.observed.json'
          python -m scriptorium.single_page_body capture \
            --revision-manifest "$revision" \
            --output "$observed"
          if [[ -f "$expected" ]]; then
            cmp "$expected" "$observed"
            python -m scriptorium.single_page_body replay \
              --revision-manifest "$revision" \
              --body-manifest "$expected" \
              --receipt build/repro/grin-road-nowhere-ru.alternate-body.replay.json
          else
            echo 'Committed literary-body identity not present yet; capture artifact is bootstrap evidence.'
          fi

      - name: Verify observed body artifact is source-free and fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/repro/grin-road-nowhere-ru.alternate-body.observed.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          assert manifest['candidate_id'] == 'grin-road-nowhere-ru'
          assert manifest['source_revision']['revision_id'] == 5585836
          assert manifest['extraction']['profile'] == 'scriptorium-wikisource-body-v1'
          assert manifest['extraction']['source_text_committed'] is False
          assert manifest['literary_body_identity']['character_count_including_spaces'] >= 300000
          assert manifest['fantlab_source_edition_match'] == 'unknown'
          assert manifest['diagnostic_comparison_admissible'] is True
          assert manifest['m2_parity_admissible'] is False
          forbidden = {'wikitext', 'content', 'body', 'text', 'source_text'}
          assert not forbidden.intersection(manifest)
          print('SCRIPTORIUM_ROAD_NOWHERE_BODY=' + json.dumps({
              'candidate_id': manifest['candidate_id'],
              'source_revision': manifest['source_revision'],
              'extraction_profile': manifest['extraction']['profile'],
              'literary_body_identity': manifest['literary_body_identity'],
              'fantlab_source_edition_match': manifest['fantlab_source_edition_match'],
              'm2_parity_admissible': manifest['m2_parity_admissible'],
          }, ensure_ascii=False, sort_keys=True, separators=(',', ':')))
          PY

      - name: Upload source-free capture and replay evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: road-nowhere-alternate-source-revision
          path: build/repro/grin-road-nowhere-ru.alternate-*.json
          if-no-files-found: error
          retention-days: 7
