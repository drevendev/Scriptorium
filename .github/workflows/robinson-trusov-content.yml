name: Trusov 1775 pinned Page content preflight

on:
  pull_request:
    paths:
      - ".github/workflows/robinson-trusov-content.yml"
      - "scriptorium/robinson_trusov_content.py"
      - "tests/test_robinson_trusov_content.py"
      - "scriptorium/robinson_trusov_template_shapes.py"
      - "tests/test_robinson_trusov_template_shapes.py"
      - "scriptorium/robinson_trusov_projection.py"
      - "tests/test_robinson_trusov_projection.py"
      - "corpus/candidates/diagnostics/defoe-robinson-crusoe-trusov-1775-ru.template-shapes-summary.json"
      - "corpus/candidates/source-edition-traces/defoe-robinson-crusoe-trusov-1775-ru.page-graph.json"
      - "corpus/candidates/source-edition-traces/defoe-robinson-crusoe-trusov-1775-ru.page-graph-receipt.json"
      - "corpus/candidates/diagnostics/defoe-robinson-crusoe-trusov-1775-ru.content-preflight-receipt.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusov-page-content:
    name: Verify exact historical Page source content without prose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Source-free and negative regression tests
        run: |
          python -m unittest discover -s tests -p 'test_robinson_trusov_content.py' -v
          python -m unittest discover -s tests -p 'test_robinson_trusov_template_shapes.py' -v
          python -m unittest discover -s tests -p 'test_robinson_trusov_projection.py' -v
      - name: Capture pinned Page contents with bounded MediaWiki requests
        run: |
          mkdir -p build/repro
          python -m scriptorium.robinson_trusov_projection \
            --graph corpus/candidates/source-edition-traces/defoe-robinson-crusoe-trusov-1775-ru.page-graph.json \
            --receipt corpus/candidates/source-edition-traces/defoe-robinson-crusoe-trusov-1775-ru.page-graph-receipt.json \
            --preflight-output build/repro/trusov-1775.content-preflight.json \
            --shapes-output build/repro/trusov-1775.template-shapes.json \
            --output build/repro/trusov-1775.projection.json
      - name: Validate source-free output and preserve unknown scientific gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scriptorium.robinson_trusov_pages import verify_frozen_graph
          from scriptorium.robinson_trusov_content import validate_preflight
          base=Path("corpus/candidates/source-edition-traces")
          graph=verify_frozen_graph(base/"defoe-robinson-crusoe-trusov-1775-ru.page-graph.json",base/"defoe-robinson-crusoe-trusov-1775-ru.page-graph-receipt.json")
          result=json.loads(Path("build/repro/trusov-1775.content-preflight.json").read_text(encoding="utf-8"))
          validate_preflight(result, graph)
          assert result["page_count"]==150
          assert result["status"]=="TRANSCLUSION_INPUT_PREFLIGHT_ONLY"
          assert result["literary_body_sha256"] is None
          assert result["corpus_threshold_verified"] is False
          assert result["m2_parity_admissible"] is False
          from scriptorium.robinson_trusov_content import verify_receipt
          verified=verify_receipt(
            Path("build/repro/trusov-1775.content-preflight.json"),
            Path("corpus/candidates/diagnostics/defoe-robinson-crusoe-trusov-1775-ru.content-preflight-receipt.json"),
            graph)
          assert verified == result
          from scriptorium.robinson_trusov_template_shapes import validate_shapes
          shapes=json.loads(Path("build/repro/trusov-1775.template-shapes.json").read_text(encoding="utf-8"))
          validate_shapes(shapes, graph, result)
          from scriptorium.robinson_trusov_template_shapes import verify_observation
          summary=json.loads(Path("corpus/candidates/diagnostics/defoe-robinson-crusoe-trusov-1775-ru.template-shapes-summary.json").read_text(encoding="utf-8"))
          verify_observation(shapes, summary)
          assert shapes["total_invocations"] + shapes["unclassified_openers"] == sum(x["template_openers"] for x in result["pages"])
          from scriptorium.robinson_trusov_projection import validate_projection
          projection=json.loads(Path("build/repro/trusov-1775.projection.json").read_text(encoding="utf-8"))
          validate_projection(projection, graph, result, shapes)
          assert projection["projected_page_join_profile"] == "one_LF_between_projected_Page_inputs_diagnostic_only"
          assert projection["projected_page_join_seams"] == 149
          assert projection["joined_projected_wikitext_characters_including_spaces"] == (
            sum(p["projected_wikitext_characters_including_spaces"] for p in projection["pages"]) + 149
          )
          from scriptorium.robinson_trusov_projection import VAR_PREVIEW_PROFILE
          assert projection["var_preview_profile"] == VAR_PREVIEW_PROFILE
          assert projection["flat_var_preview_count"] == sum(p["flat_var_preview_count"] for p in projection["pages"])
          assert 0 <= projection["flat_var_preview_count"] <= summary["literal_template_counts"]["ВАР"]
          assert projection["unresolved_invocations"] >= summary["literal_template_counts"]["ВАР"]
          assert sum(projection["var_preview_refusal_reasons"].values()) + projection["flat_var_preview_count"] == summary["literal_template_counts"]["ВАР"]
          assert len(projection["joined_pre_reform_var_preview_sha256"]) == 64
          assert len(projection["joined_modern_var_preview_sha256"]) == 64
          assert projection["literary_body_sha256"] is None
          assert projection["historical_render_equivalence_proven"] is False
          print("Pinned preflight, shapes, template projection and synthetic Page join PASS; literary body NOT_RUN")
          PY
      - name: Upload only derived diagnostic identities
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: robinson-trusov-page-content-preflight
          path: |
            build/repro/trusov-1775.content-preflight.json
            build/repro/trusov-1775.template-shapes.json
            build/repro/trusov-1775.projection.json
          if-no-files-found: error
          retention-days: 7
