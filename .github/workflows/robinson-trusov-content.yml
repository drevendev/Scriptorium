name: Trusov 1775 pinned Page content preflight

on:
  pull_request:
    paths:
      - ".github/workflows/robinson-trusov-content.yml"
      - "scriptorium/robinson_trusov_content.py"
      - "tests/test_robinson_trusov_content.py"
      - "scriptorium/robinson_trusov_template_shapes.py"
      - "tests/test_robinson_trusov_template_shapes.py"
      - "scriptorium/robinson_trusov_projection.py"
      - "tests/test_robinson_trusov_projection.py"
      - "scriptorium/robinson_trusov_interior.py"
      - "tests/test_robinson_trusov_interior.py"
      - "scriptorium/robinson_trusov_full_candidate.py"
      - "tests/test_robinson_trusov_full_candidate.py"
      - "scriptorium/robinson_trusov_boundary_render.py"
      - "tests/test_robinson_trusov_boundary_render.py"
      - "scriptorium/robinson_trusov_opening_seam.py"
      - "tests/test_robinson_trusov_opening_seam.py"
      - "scriptorium/robinson_trusov_closing_seams.py"
      - "tests/test_robinson_trusov_closing_seams.py"
      - "scriptorium/robinson_trusov_missing_folios.py"
      - "tests/test_robinson_trusov_missing_folios.py"
      - "scriptorium/robinson_trusov_errata.py"
      - "tests/test_robinson_trusov_errata.py"
      - "corpus/candidates/diagnostics/defoe-robinson-crusoe-trusov-1775-ru.template-shapes-summary.json"
      - "corpus/candidates/diagnostics/defoe-robinson-crusoe-trusov-1775-ru.interior-measured.json"
      - "corpus/candidates/source-edition-traces/defoe-robinson-crusoe-trusov-1775-ru.page-graph.json"
      - "corpus/candidates/source-edition-traces/defoe-robinson-crusoe-trusov-1775-ru.page-graph-receipt.json"
      - "corpus/candidates/diagnostics/defoe-robinson-crusoe-trusov-1775-ru.content-preflight-receipt.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusov-page-content:
    name: Verify exact historical Page source content without prose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Source-free and negative regression tests
        run: |
          python -m unittest discover -s tests -p 'test_robinson_trusov_content.py' -v
          python -m unittest discover -s tests -p 'test_robinson_trusov_template_shapes.py' -v
          python -m unittest discover -s tests -p 'test_robinson_trusov_projection.py' -v
          python -m unittest discover -s tests -p 'test_robinson_trusov_interior.py' -v
          python -m unittest discover -s tests -p 'test_robinson_trusov_full_candidate.py' -v
          python -m unittest discover -s tests -p 'test_robinson_trusov_boundary_render.py' -v
          python -m unittest discover -s tests -p 'test_robinson_trusov_opening_seam.py' -v
          python -m unittest discover -s tests -p 'test_robinson_trusov_closing_seams.py' -v
          python -m unittest discover -s tests -p 'test_robinson_trusov_errata.py' -v
          python -m unittest discover -s tests -p 'test_robinson_trusov_missing_folios.py' -v
      - name: Capture pinned Page contents with bounded MediaWiki requests
        run: |
          mkdir -p build/repro
          python -m scriptorium.robinson_trusov_projection \
            --graph corpus/candidates/source-edition-traces/defoe-robinson-crusoe-trusov-1775-ru.page-graph.json \
            --receipt corpus/candidates/source-edition-traces/defoe-robinson-crusoe-trusov-1775-ru.page-graph-receipt.json \
            --preflight-output build/repro/trusov-1775.content-preflight.json \
            --shapes-output build/repro/trusov-1775.template-shapes.json \
            --output build/repro/trusov-1775.projection.json \
            --interior-output build/repro/trusov-1775.interior-metrics.json \
            --seam-output build/repro/trusov-1775.seam-sensitivity.json \
            --full-candidate-output build/repro/trusov-1775.full-projection-candidate.json \
            --boundary-render-output build/repro/trusov-1775.boundary-render.json \
            --missing-folios-output build/repro/trusov-1775.missing-folios.json \
            --folio-metric-output build/repro/trusov-1775.folio-join-metrics.json \
            --boundary-assembly-output build/repro/trusov-1775.boundary-assembly.json
      - name: Validate source-free output and preserve unknown scientific gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scriptorium.robinson_trusov_pages import verify_frozen_graph
          from scriptorium.robinson_trusov_content import validate_preflight
          base=Path("corpus/candidates/source-edition-traces")
          graph=verify_frozen_graph(base/"defoe-robinson-crusoe-trusov-1775-ru.page-graph.json",base/"defoe-robinson-crusoe-trusov-1775-ru.page-graph-receipt.json")
          result=json.loads(Path("build/repro/trusov-1775.content-preflight.json").read_text(encoding="utf-8"))
          validate_preflight(result, graph)
          assert result["page_count"]==150
          assert result["status"]=="TRANSCLUSION_INPUT_PREFLIGHT_ONLY"
          assert result["literary_body_sha256"] is None
          assert result["corpus_threshold_verified"] is False
          assert result["m2_parity_admissible"] is False
          from scriptorium.robinson_trusov_content import verify_receipt
          verified=verify_receipt(
            Path("build/repro/trusov-1775.content-preflight.json"),
            Path("corpus/candidates/diagnostics/defoe-robinson-crusoe-trusov-1775-ru.content-preflight-receipt.json"),
            graph)
          assert verified == result
          from scriptorium.robinson_trusov_template_shapes import validate_shapes
          shapes=json.loads(Path("build/repro/trusov-1775.template-shapes.json").read_text(encoding="utf-8"))
          validate_shapes(shapes, graph, result)
          from scriptorium.robinson_trusov_template_shapes import verify_observation
          summary=json.loads(Path("corpus/candidates/diagnostics/defoe-robinson-crusoe-trusov-1775-ru.template-shapes-summary.json").read_text(encoding="utf-8"))
          verify_observation(shapes, summary)
          assert shapes["total_invocations"] + shapes["unclassified_openers"] == sum(x["template_openers"] for x in result["pages"])
          from scriptorium.robinson_trusov_projection import validate_projection
          projection=json.loads(Path("build/repro/trusov-1775.projection.json").read_text(encoding="utf-8"))
          validate_projection(projection, graph, result, shapes)
          assert projection["projected_page_join_profile"] == "one_LF_between_projected_Page_inputs_diagnostic_only"
          assert projection["projected_page_join_seams"] == 149
          assert projection["joined_projected_wikitext_characters_including_spaces"] == (
            sum(p["projected_wikitext_characters_including_spaces"] for p in projection["pages"]) + 149
          )
          from scriptorium.robinson_trusov_projection import VAR_PREVIEW_PROFILE
          assert projection["var_preview_profile"] == VAR_PREVIEW_PROFILE
          assert projection["flat_var_preview_count"] == sum(p["flat_var_preview_count"] for p in projection["pages"])
          assert projection["multiline_var_preview_count"] == sum(p["multiline_var_preview_count"] for p in projection["pages"])
          assert 0 <= projection["flat_var_preview_count"] + projection["multiline_var_preview_count"] <= summary["literal_template_counts"]["ВАР"]
          assert projection["unresolved_invocations"] >= summary["literal_template_counts"]["ВАР"]
          assert (sum(projection["var_preview_refusal_reasons"].values()) + projection["flat_var_preview_count"] + projection["multiline_var_preview_count"] == summary["literal_template_counts"]["ВАР"])
          # A decision per literal call, exactly bound to frozen 2023 oldid/SHA-1
          # and invocation SHA-256. Never echo arguments or page prose.
          var_rows=[p for p in projection["pages"] if p["var_call_partition"]]
          assert sum(len(p["var_call_partition"]) for p in var_rows)==4
          assert {p["page_sequence"] for p in var_rows} <= {148,149,150,151}
          for p in var_rows:
            frozen=next(x for x in graph["pages"] if x["page_sequence"]==p["page_sequence"])
            assert (p["revision_id"],p["source_mediawiki_sha1"]) == (frozen["revision_id"],frozen["mediawiki_sha1"])
            print(f"Trusov VAR Page {p['page_sequence']} oldid={p['revision_id']} source_sha1={p['source_mediawiki_sha1']} decisions={[d['decision'] for d in p['var_call_partition']]}")
          print(f"Trusov VAR preview: flat={projection['flat_var_preview_count']}, multiline={projection['multiline_var_preview_count']}, residual={projection['var_preview_refusal_reasons']}")
          assert len(projection["joined_pre_reform_var_preview_sha256"]) == 64
          assert len(projection["joined_modern_var_preview_sha256"]) == 64
          assert projection["literary_body_sha256"] is None
          assert projection["historical_render_equivalence_proven"] is False
          from scriptorium.robinson_trusov_interior import SCHEMA as INTERIOR_SCHEMA
          interior=json.loads(Path("build/repro/trusov-1775.interior-metrics.json").read_text(encoding="utf-8"))
          assert interior["schema_version"] == INTERIOR_SCHEMA
          retained=json.loads(Path("corpus/candidates/diagnostics/defoe-robinson-crusoe-trusov-1775-ru.interior-measured.json").read_text(encoding="utf-8"))
          assert interior == retained, "source-free pinned interior measurements changed"
          assert interior["page_interval"]["count"] == 145
          assert interior["page_interval"]["excluded_pages"] == [2,148,149,150,151]
          assert interior["page_interval"]["opening_truncated"] is True
          assert interior["page_interval"]["ending_truncated"] is True
          assert interior["source_page_graph_sha256"] == projection["source_page_graph_sha256"]
          assert len(interior["metric_rows"]) == 29
          assert interior["numeric_metric_count"] + interior["unavailable_metric_count"] == 29
          assert all(row["fantlab_display"] is None for row in interior["metric_rows"])
          assert interior["gates"]["m2_parity_admissible"] is False
          assert interior["gates"]["corpus_admitted_for_calibration"] is False
          assert interior["gates"]["full_literary_body"] == "NOT_RUN"
          assert interior["gates"]["page_join_historical_identity"] == "UNKNOWN"
          assert interior["join"]["projected_page_join_seams"] == 144
          from scriptorium.robinson_trusov_interior import SEAM_SCHEMA
          seam=json.loads(Path("build/repro/trusov-1775.seam-sensitivity.json").read_text(encoding="utf-8"))
          assert seam["schema_version"] == SEAM_SCHEMA
          assert seam["scope"] == "SYNTHETIC_PAGE_JOIN_SENSITIVITY_ONLY"
          assert seam["baseline_normalized_sha256"] == interior["normalized_sha256"]
          assert seam["source_page_graph_sha256"] == interior["source_page_graph_sha256"]
          assert seam["source_revision_list_sha256"] == interior["source_revision_list_sha256"]
          assert seam["baseline_numeric_metrics"] == interior["numeric_metric_count"]
          assert all(seam[key] is False for key in ("historical_page_join_verified", "complete_literary_body", "corpus_admitted", "m2_parity_admissible", "source_text_committed"))
          assert [v["join_profile"] for v in seam["alternatives"]] == ["direct_concatenation_stress_test", "one_space_ProofreadPage_default_hypothesis", "two_LF_paragraph_stress_test"]
          assert all(len(v["metrics"]) == 29 for v in seam["alternatives"])
          assert [v["normalized_characters_including_spaces"] for v in seam["alternatives"]] == [interior["normalized_characters_including_spaces"]-144, interior["normalized_characters_including_spaces"], interior["normalized_characters_including_spaces"]+144]
          assert all(v["changed_numeric_metrics"] == sum(r["status"] == "CHANGED" for r in v["metrics"]) for v in seam["alternatives"])
          print("Trusov Page-join sensitivity:", [(v["join_profile"],v["changed_numeric_metrics"]) for v in seam["alternatives"]], "historical join NOT_VERIFIED")
          print("Trusov 145-Page inferred interior 29-metric diagnostic",
                interior["numeric_metric_count"], "numeric, status",
                interior["status"], "corpus NOT_ADMITTED; M2 0/5")
          # A full-candidate analyzer is executable but MUST refuse the five
          # unresolved boundary Pages in the real pinned historical source.
          from scriptorium.robinson_trusov_full_candidate import SCHEMA as FULL_SCHEMA, BLOCKED
          candidate=json.loads(Path("build/repro/trusov-1775.full-projection-candidate.json").read_text(encoding="utf-8"))
          assert candidate["schema_version"] == FULL_SCHEMA
          assert candidate["source_page_graph_sha256"] == interior["source_page_graph_sha256"]
          assert candidate["status"] == BLOCKED
          assert [row["page_sequence"] for row in candidate["blocked_pages"]] == [2,148,149,150,151]
          assert candidate["metric_rows"] is None
          assert candidate["normalized_sha256"] is None
          assert candidate["normalized_characters_including_spaces"] is None
          assert candidate["numeric_metric_count"] is None
          assert candidate["gates"]["full_literary_body"] == "NOT_VERIFIED"
          assert candidate["gates"]["m2_parity_admissible"] is False
          assert candidate["gates"]["corpus_admitted_for_calibration"] is False
          assert candidate["gates"]["source_text_committed"] is False
          print("Trusov 150-Page full candidate: BLOCKED on 2/148-151; no metrics or prose published")
          print("Pinned preflight, shapes, template projection and synthetic Page join PASS; literary body NOT_RUN")
          PY
      - name: Observe current Page-view parser on five excluded boundaries and two controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("build/repro/trusov-1775.boundary-render.json").read_text())
          assert [p["page_sequence"] for p in r["pages"]] == [2,3,147,148,149,150,151]
          assert r["schema_version"] == "scriptorium-trusov-boundary-render-v3"
          controls = [p for p in r["pages"] if "whitespace_control" in p]
          assert [p["page_sequence"] for p in controls] == [3,147]
          assert all(p["whitespace_control"]["classification"] in {"COLLAPSED_EQUAL", "NONSPACE_EQUAL_ONLY", "NONSPACE_DIFFERS", "RENDER_REFUSED"} for p in controls)
          for p in controls:
              w = p["whitespace_control"]
              d = w["nonspace_edit_summary"]
              assert p["skipped_body_nonspace_characters"] >= 0
              assert d["status"] in {"ALIGNED", "RENDER_REFUSED", "SIZE_LIMIT"}
              if d["status"] == "ALIGNED":
                  assert d["matching_characters"] + sum(d["projected_changed_unicode_categories"].values()) == w["projected_nonspace_characters"]
                  assert d["matching_characters"] + sum(d["rendered_changed_unicode_categories"].values()) == w["rendered_nonspace_characters"]
              print("Control", p["page_sequence"], w["classification"], d, "skipped nonspace", p["skipped_body_nonspace_characters"])
          assert r["full_literary_body"] == "NOT_VERIFIED"
          assert not r["historical_dependencies_pinned"] and not r["corpus_admitted"]
          assert not r["m2_parity_admissible"] and not r["source_text_committed"]
          print([(p["page_sequence"], p["status"], p["candidate_characters"]) for p in r["pages"]])
          PY
      - name: Replay exact opening Page scope and compare the accepted control
        run: |
          python -m scriptorium.robinson_trusov_opening_seam \
            --graph corpus/candidates/source-edition-traces/defoe-robinson-crusoe-trusov-1775-ru.page-graph.json \
            --receipt corpus/candidates/source-edition-traces/defoe-robinson-crusoe-trusov-1775-ru.page-graph-receipt.json \
            --preflight build/repro/trusov-1775.content-preflight.json \
            --preflight-receipt corpus/candidates/diagnostics/defoe-robinson-crusoe-trusov-1775-ru.content-preflight-receipt.json \
            --output build/repro/trusov-1775.opening-seam.json \
            --layout-output build/repro/trusov-1775.opening-layout.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("build/repro/trusov-1775.opening-seam.json").read_text())
          b = json.loads(Path("build/repro/trusov-1775.boundary-render.json").read_text())
          assert r["schema_version"] == "scriptorium-trusov-opening-seam-v1"
          assert r["source_page_graph_sha256"] == b["source_page_graph_sha256"]
          assert [p["revision_id"] for p in r["pages"]] == [4958669, 4958680]
          seam = r["seam"]
          assert seam == {"classification": "PAGE_BOUNDARY_CONTINUATION_NOINCLUDE",
                          "excluded_letters": 4, "excluded_punctuation": 1,
                          "left_suffix_matches": True, "right_prefix_repeats": False}
          control = next(p for p in b["pages"] if p["page_sequence"] == 3)
          d = control["whitespace_control"]["nonspace_edit_summary"]
          assert d["status"] == "ALIGNED"
          assert d["edit_runs"]["insert"] == 1
          assert d["edit_runs"]["delete"] == d["edit_runs"]["replace"] == 0
          assert d["rendered_changed_unicode_categories"]["L"] == seam["excluded_letters"]
          assert d["rendered_changed_unicode_categories"]["P"] == seam["excluded_punctuation"]
          assert r["full_literary_body"] == "NOT_VERIFIED"
          assert not any(r[k] for k in ("source_text_committed", "corpus_admitted", "m2_parity_admissible", "historical_render_equivalence_proven"))
          layout = json.loads(Path("build/repro/trusov-1775.opening-layout.json").read_text())
          assert layout["schema_version"] == "scriptorium-trusov-opening-layout-v1"
          assert layout["source_page_graph_sha256"] == r["source_page_graph_sha256"]
          assert layout["page"] == r["pages"][0]
          counts = layout["layout"]
          assert counts["classification"] == "TITLE_PREFIX_PARTITION_CANDIDATE"
          assert counts["heading_calls"] == 4 and counts["spacing_calls"] == 2
          assert counts["input_characters_including_spaces"] == counts["layout_prefix_characters"] + counts["body_candidate_characters_including_spaces"] + counts["body_edge_whitespace_characters"]
          preflight = json.loads(Path("build/repro/trusov-1775.content-preflight.json").read_text())
          p2 = next(p for p in preflight["pages"] if p["page_sequence"] == 2)
          assert counts["input_characters_including_spaces"] == p2["transclusion_input_characters_including_spaces"]
          assert counts["body_candidate_nonspace_characters"] > 0
          target = layout["spacing_target"]
          assert [p["revision_id"] for p in target["target_revisions"]] == [4937800, 5183352]
          assert target["target_bytes_equal"] and target["historical_redirect_bytes"] == "NOT_VERIFIED"
          assert not target["historical_render_equivalence_proven"]
          assert layout["full_literary_body"] == "NOT_VERIFIED"
          assert not any(layout[k] for k in ("source_text_committed", "corpus_admitted", "m2_parity_admissible", "historical_render_equivalence_proven"))
          print("Opening layout counts:", counts, "; target bytes equal; old redirect NOT_VERIFIED")
          PY
      - name: Replay the three pinned closing seams in both literal VAR branches
        run: |
          python -m scriptorium.robinson_trusov_closing_seams \
            --graph corpus/candidates/source-edition-traces/defoe-robinson-crusoe-trusov-1775-ru.page-graph.json \
            --receipt corpus/candidates/source-edition-traces/defoe-robinson-crusoe-trusov-1775-ru.page-graph-receipt.json \
            --preflight build/repro/trusov-1775.content-preflight.json \
            --preflight-receipt corpus/candidates/diagnostics/defoe-robinson-crusoe-trusov-1775-ru.content-preflight-receipt.json \
            --output build/repro/trusov-1775.closing-seams.json --compare-current
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("build/repro/trusov-1775.closing-seams.json").read_text())
          p = json.loads(Path("build/repro/trusov-1775.content-preflight.json").read_text())
          assert r["schema_version"] == "scriptorium-trusov-closing-seams-v1"
          assert r["source_page_graph_sha256"] == p["source_page_graph_sha256"]
          assert [x["revision_id"] for x in r["pages"]] == [4958660,4958661,4958663,4958664]
          assert [x["excluded_letters"] for x in r["seams"]] == [3,2,6,6,3,3]
          assert [x["owner"] for x in r["seams"]] == ["right"]*2 + ["left"]*4
          assert all(x["owner_matches"] and not x["duplicate_at_other_boundary"] for x in r["seams"])
          assert len(r["final_branch_observations"]) == 2
          assert all(x["ends_in_sentence_punctuation"] for x in r["final_branch_observations"])
          assert r["facing_errata_excluded_by_full_collation"] == "NOT_VERIFIED"
          assert r["full_literary_body"] == "NOT_VERIFIED"
          assert not any(r[k] for k in ("source_text_committed", "corpus_admitted", "m2_parity_admissible", "historical_render_equivalence_proven"))
          PY
      - name: Validate closing scope versus current Page-view counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("build/repro/trusov-1775.closing-seams.json").read_text())
          c = r["current_page_view_comparison"]
          assert c["scope"] == "CURRENT_PAGE_VIEW_VS_LITERAL_CLOSING_SCOPE_DIAGNOSTIC"
          assert [p["page_sequence"] for p in c["pages"]] == [148,149,150,151]
          assert [p["revision_id"] for p in c["pages"]] == [4958660,4958661,4958663,4958664]
          for p, pin in zip(c["pages"], r["pages"], strict=True):
              assert p["source_mediawiki_sha1"] == pin["source_mediawiki_sha1"]
              assert [b["literal_branch"] for b in p["branches"]] == ["pre_reform", "modern"]
              for b in p["branches"]:
                  for scope in ("transcluded_scope", "standalone_scope"):
                      a = b[scope]
                      d = a["nonspace_edit_summary"]
                      if d["status"] == "ALIGNED":
                          assert d["matching_characters"] + sum(d["projected_changed_unicode_categories"].values()) == a["literal_nonspace_characters"]
                          assert d["matching_characters"] + sum(d["rendered_changed_unicode_categories"].values()) == a["rendered_nonspace_characters"]
                  # Only the proven continuation may differ in nonspace count.
                  expected = {148: (3,2),149: (0,0),150: (6,6),151: (3,3)}[p["page_sequence"]]
                  i = 0 if b["literal_branch"] == "pre_reform" else 1
                  assert b["standalone_scope"]["literal_nonspace_characters"] - b["transcluded_scope"]["literal_nonspace_characters"] == expected[i]
              print("Closing Page", p["page_sequence"], p["render_status"],
                    [(b["literal_branch"], b["transcluded_scope"]["classification"],
                      b["standalone_scope"]["classification"]) for b in p["branches"]])
          for p in c["pages"]:
              for scope, combined in p["combined_branches"].items():
                  assert scope in {"standalone_scope", "transcluded_scope"}
                  assert combined["branch_nonspace_characters"] == [
                      b[scope]["literal_nonspace_characters"] for b in p["branches"]]
                  assert combined["rendered_nonspace_characters"] == p["branches"][0][scope]["rendered_nonspace_characters"]
                  if combined["classification"] == "UNIQUE_ORDERED_PLACEMENT":
                      assert combined["placement_count_capped"] == 1
                      assert combined["order"] in {"PRE_REFORM_THEN_MODERN", "MODERN_THEN_PRE_REFORM"}
                      regions = combined["residual_regions"]
                      assert [x["region"] for x in regions] == ["prefix", "between", "suffix"]
                      assert all(sum(x["unicode_categories"].values()) == x["nonspace_characters"] for x in regions)
                      assert sum(combined["branch_nonspace_characters"]) + sum(x["nonspace_characters"] for x in regions) == combined["rendered_nonspace_characters"]
                  else:
                      assert combined["classification"] in {"RENDER_REFUSED", "SIZE_LIMIT", "EMPTY_BRANCH", "AMBIGUOUS_PLACEMENT", "NO_ORDERED_DISJOINT_PLACEMENT"}
                      assert combined["residual_regions"] is None and combined["order"] is None
                  print("Combined Page", p["page_sequence"], scope, combined)
          assert c["layout_module"]["revision_id"] == 5721277
          assert c["layout_module"]["page_id"] > 0
