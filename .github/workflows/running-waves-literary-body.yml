name: Running on Waves literary body

on:
  pull_request:
    paths:
      - '.github/workflows/running-waves-literary-body.yml'
      - 'scriptorium/running_waves_body.py'
      - 'scriptorium/running_waves_revisions.py'
      - 'scriptorium/wikisource_freeze.py'
      - 'scriptorium/wikisource_replay.py'
      - 'scriptorium/text.py'
      - 'tests/test_running_waves_body.py'
      - 'corpus/candidates/grin-running-on-waves-ru.md'
      - 'corpus/candidates/source-edition-traces/grin-running-on-waves-ru.json'
      - 'corpus/candidates/source-edition-traces/grin-running-on-waves-ru.source-revisions.json'
      - 'corpus/candidates/source-edition-traces/grin-running-on-waves-ru.literary-body.json'
      - 'project/STATE_AND_QUEUE.md'
      - 'project/CHANGELOG.md'
      - 'project/CHANGELOG.d/SCRIP-CORPUS-028.md'
      - 'project/run-receipts/SCRIP-CORPUS-028.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run standard-library test suite
        run: python -m unittest discover -s tests
      - name: Capture observed source-free literary-body manifest
        run: |
          python -m scriptorium.running_waves_body capture \
            --source-manifest corpus/candidates/source-edition-traces/grin-running-on-waves-ru.source-revisions.json \
            --output /tmp/grin-running-on-waves-ru.literary-body.observed.json
      - name: Report source-free extraction shape on capture failure
        if: failure()
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from scriptorium.running_waves_revisions import validate_manifest
          from scriptorium.wikisource_freeze import _api_query
          from scriptorium.wikisource_replay import fetch_pinned_chapter_revisions

          source = json.loads(Path('corpus/candidates/source-edition-traces/grin-running-on-waves-ru.source-revisions.json').read_text(encoding='utf-8'))
          identities = validate_manifest(source)
          revisions = fetch_pinned_chapter_revisions(identities)
          body_re = re.compile(r'<div\s+class=["\'](?:text|indent)["\']\s*>(.*?)</div>', re.I | re.S)

          def template_calls(fragment):
              calls = []
              stack = []
              index = 0
              while index < len(fragment) - 1:
                  pair = fragment[index:index + 2]
                  if pair == '{{':
                      stack.append(index)
                      index += 2
                      continue
                  if pair == '}}' and stack:
                      start = stack.pop()
                      if not stack:
                          inner = fragment[start + 2:index]
                          calls.append(inner)
                          calls.extend(template_calls(inner))
                      index += 2
                      continue
                  index += 1
              return calls

          def split_top_level(inner):
              parts = []
              start = 0
              brace = bracket = 0
              index = 0
              while index < len(inner):
                  pair = inner[index:index + 2]
                  if pair == '{{':
                      brace += 1
                      index += 2
                      continue
                  if pair == '}}' and brace:
                      brace -= 1
                      index += 2
                      continue
                  if pair == '[[':
                      bracket += 1
                      index += 2
                      continue
                  if pair == ']]' and bracket:
                      bracket -= 1
                      index += 2
                      continue
                  if inner[index] == '|' and brace == 0 and bracket == 0:
                      parts.append(inner[start:index])
                      start = index + 1
                  index += 1
              parts.append(inner[start:])
              return parts

          observed_names = set()
          for row in identities:
              title = str(row['title'])
              matches = body_re.findall(revisions[title])
              shapes = []
              for fragment in matches:
                  for inner in template_calls(fragment):
                      parts = split_top_level(inner)
                      if not parts:
                          continue
                      name = parts[0].strip()
                      observed_names.add(name)
                      positional = []
                      named_keys = []
                      empty_positions = []
                      numeric = {}
                      for raw in parts[1:]:
                          value = raw.strip()
                          if '=' in value:
                              key, _ = value.split('=', 1)
                              if key.strip() and not key.strip().isdigit():
                                  named_keys.append(key.strip())
                                  continue
                          positional.append(value)
                          if not value:
                              empty_positions.append(len(positional))
                          if re.fullmatch(r'[0-9]+', value):
                              numeric[str(len(positional))] = value
                      shapes.append({
                          'template': name,
                          'positional_count': len(positional),
                          'empty_positions': empty_positions,
                          'named_keys': sorted(named_keys),
                          'numeric_positional_values': numeric,
                      })
              print(json.dumps({'ordinal': row['ordinal'], 'title': title, 'body_div_count': len(matches), 'template_shapes': shapes}, ensure_ascii=False, sort_keys=True))

          samples = {
              '^': '{{^}}',
              'roman': '{{roman|1}}',
              'poem1': '{{poem1||B|}}',
              'razr': '{{razr|A}}',
              'razr2': '{{razr2|A}}',
              'акут': '{{акут}}',
              'Гравис': '{{Гравис}}',
              'опечатка2': '{{опечатка2|A|B}}',
              'Так в тексте': '{{Так в тексте|A|B}}',
          }
          for name in sorted(observed_names):
              sample = samples.get(name)
              if sample is None:
                  continue
              payload = _api_query({'action': 'expandtemplates', 'text': sample, 'prop': 'wikitext'})
              print(json.dumps({'template': name, 'synthetic_input': sample, 'expanded': payload.get('expandtemplates', {}).get('wikitext')}, ensure_ascii=False, sort_keys=True))
          PY
      - name: Compare committed manifest when present
        run: |
          if test -f corpus/candidates/source-edition-traces/grin-running-on-waves-ru.literary-body.json; then
            cmp \
              corpus/candidates/source-edition-traces/grin-running-on-waves-ru.literary-body.json \
              /tmp/grin-running-on-waves-ru.literary-body.observed.json
            python -m scriptorium.running_waves_body replay \
              --source-manifest corpus/candidates/source-edition-traces/grin-running-on-waves-ru.source-revisions.json \
              --body-manifest corpus/candidates/source-edition-traces/grin-running-on-waves-ru.literary-body.json
          else
            echo 'Canonical body manifest not committed yet; capture artifact is the review input for this bootstrap pass.'
          fi
      - name: Guard source-free artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('/tmp/grin-running-on-waves-ru.literary-body.observed.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          text = path.read_text(encoding='utf-8').lower()
          forbidden = ('"wikitext"', '"source_text"', '"prose"')
          if any(token in text for token in forbidden):
              raise SystemExit('source-text-like key leaked into source-free artifact')
          if data['composition']['source_text_committed'] is not False:
              raise SystemExit('source-text boundary drift')
          if data['corpus_admission']['m2_parity_admissible'] is not False:
              raise SystemExit('M2 boundary drift')
          print(data['composite_identity']['character_count_including_spaces'])
          print(data['composite_identity']['raw_sha256'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: running-waves-literary-body-source-free
          path: /tmp/grin-running-on-waves-ru.literary-body.observed.json
          if-no-files-found: error
