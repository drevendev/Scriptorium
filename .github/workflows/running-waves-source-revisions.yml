name: Running on Waves source revisions

on:
  pull_request:
    paths:
      - ".github/workflows/running-waves-source-revisions.yml"
      - "scriptorium/running_waves_inventory.py"
      - "scriptorium/running_waves_revisions.py"
      - "scriptorium/wikisource_freeze.py"
      - "scriptorium/wikisource_replay.py"
      - "tests/test_running_waves_revisions.py"
      - "corpus/candidates/grin-running-on-waves-ru.md"
      - "corpus/candidates/source-edition-traces/grin-running-on-waves-ru.json"
      - "corpus/candidates/source-edition-traces/grin-running-on-waves-ru.source-revisions.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    name: Capture and replay 36 literary page revisions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v

      - name: Capture current source-free revision identities
        run: |
          set -euo pipefail
          mkdir -p build/repro
          python -m scriptorium.running_waves_revisions capture \
            --output build/repro/grin-running-on-waves-ru.source-revisions.observed.json

      - name: Compare and replay committed revision manifest when present
        run: |
          set -euo pipefail
          expected='corpus/candidates/source-edition-traces/grin-running-on-waves-ru.source-revisions.json'
          observed='build/repro/grin-running-on-waves-ru.source-revisions.observed.json'
          if [[ -f "$expected" ]]; then
            EXPECTED="$expected" OBSERVED="$observed" python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = json.loads(Path(os.environ['EXPECTED']).read_text(encoding='utf-8'))
          observed = json.loads(Path(os.environ['OBSERVED']).read_text(encoding='utf-8'))
          if expected != observed:
              raise SystemExit('committed Running on Waves revision manifest drifted from live source-free capture')
          print('Committed revision manifest matches live source-free capture semantically.')
          PY
            python -m scriptorium.running_waves_revisions replay --manifest "$expected"
          else
            echo 'Committed revision manifest not present yet; capture artifact is bootstrap evidence.'
          fi

      - name: Verify source-free fail-closed capture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/repro/grin-running-on-waves-ru.source-revisions.observed.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          assert manifest['candidate_id'] == 'grin-running-on-waves-ru'
          assert manifest['source_work_index_revision_id'] == 2595407
          assert manifest['route_inventory_revision_id'] == 4715419
          assert manifest['composition_contract'] == {
              'literary_page_count': 36,
              'order': 'exact route order /1 through /35 then /Эпилог',
          }
          assert len(manifest['pages']) == 36
          assert [row['ordinal'] for row in manifest['pages']] == list(range(1, 37))
          assert len({row['page_id'] for row in manifest['pages']}) == 36
          assert len({row['revision_id'] for row in manifest['pages']}) == 36
          assert all(len(row['mediawiki_sha1']) == 40 for row in manifest['pages'])
          assert manifest['capture_scope'] == {
              'route_inventory_frozen': True,
              'literary_page_revisions_frozen': True,
              'literary_body_extraction_frozen': False,
              'composite_identity_frozen': False,
              'source_text_committed': False,
              'fantlab_source_edition_match': 'unknown',
          }

          forbidden = {'wikitext', 'content', 'body', 'text', 'source_text'}
          def walk(value):
              if isinstance(value, dict):
                  assert not forbidden.intersection(value)
                  for nested in value.values():
                      walk(nested)
              elif isinstance(value, list):
                  for nested in value:
                      walk(nested)
          walk(manifest)
          print('SCRIPTORIUM_RUNNING_WAVES_REVISIONS=' + json.dumps({
              'candidate_id': manifest['candidate_id'],
              'literary_page_count': len(manifest['pages']),
              'literary_page_revisions_frozen': manifest['capture_scope']['literary_page_revisions_frozen'],
              'literary_body_extraction_frozen': manifest['capture_scope']['literary_body_extraction_frozen'],
              'composite_identity_frozen': manifest['capture_scope']['composite_identity_frozen'],
              'source_text_committed': manifest['capture_scope']['source_text_committed'],
              'fantlab_source_edition_match': manifest['capture_scope']['fantlab_source_edition_match'],
          }, ensure_ascii=False, sort_keys=True, separators=(',', ':')))
          PY

      - name: Upload source-free revision evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: running-waves-source-revisions
          path: build/repro/grin-running-on-waves-ru.source-revisions.observed.json
          if-no-files-found: error
          retention-days: 7
