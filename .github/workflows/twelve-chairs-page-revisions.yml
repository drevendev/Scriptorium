name: Twelve Chairs 1928 Page revision identities

on:
  pull_request:
    paths:
      - ".github/workflows/twelve-chairs-page-revisions.yml"
      - "scriptorium/twelve_chairs_page_freeze.py"
      - "tests/test_twelve_chairs_page_freeze.py"
      - "corpus/candidates/source-edition-traces/ilf-petrov-twelve-chairs-zif-1928.page-revisions.*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  page-identities:
    name: Capture or replay exact Twelve Chairs Page identities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v

      - name: Capture or replay source-free Page identities
        run: |
          set -euo pipefail
          mkdir -p build/repro
          index="corpus/candidates/source-edition-traces/ilf-petrov-twelve-chairs-zif-1928.page-revisions.index.json"
          if [[ -f "$index" ]]; then
            python -m scriptorium.twelve_chairs_page_freeze replay \
              --index "$index" \
              --receipt build/repro/ilf-petrov-twelve-chairs-zif-1928.page-revisions.replay.json
            echo "mode=replay" >> "$GITHUB_ENV"
          else
            python -m scriptorium.twelve_chairs_page_freeze capture \
              --manifest build/repro/ilf-petrov-twelve-chairs-zif-1928.page-revisions.capture.json
            echo "mode=capture" >> "$GITHUB_ENV"
          fi

      - name: Verify source-free artifact boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scriptorium.twelve_chairs_page_freeze import EXPECTED_PAGE_COUNT, validate_capture_manifest

          replay = Path("build/repro/ilf-petrov-twelve-chairs-zif-1928.page-revisions.replay.json")
          if replay.exists():
              receipt = json.loads(replay.read_text(encoding="utf-8"))
              assert receipt["page_revision_count"] == EXPECTED_PAGE_COUNT == 410
              assert receipt["identity_replay_match"] is True
              assert receipt["source_text_included"] is False
              assert receipt["literary_body_frozen"] is False
              assert receipt["admitted_for_calibration"] is False
              assert receipt["diagnostic_ready"] is False
              assert receipt["fantlab_source_edition_match"] == "unknown"
              assert receipt["m2_parity_admissible"] is False
              print("SCRIPTORIUM_TWELVE_CHAIRS_PAGE_REPLAY_COUNT=410")
          else:
              capture = Path("build/repro/ilf-petrov-twelve-chairs-zif-1928.page-revisions.capture.json")
              payload = json.loads(capture.read_text(encoding="utf-8"))
              rows = validate_capture_manifest(payload)
              assert len(rows) == EXPECTED_PAGE_COUNT == 410
              assert payload["source_text_included"] is False
              assert payload["literary_body_frozen"] is False
              assert payload["admitted_for_calibration"] is False
              assert payload["diagnostic_ready"] is False
              assert payload["m2_parity_admissible"] is False
              print("SCRIPTORIUM_TWELVE_CHAIRS_PAGE_CAPTURE_COUNT=410")
          PY

      - name: Upload source-free capture or replay evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: twelve-chairs-1928-page-revision-${{ env.mode }}
          path: build/repro/*.json
          if-no-files-found: error
          retention-days: 7
